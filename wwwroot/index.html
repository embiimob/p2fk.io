<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bitFossil - Search API</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <!-- Default OG / Twitter card (updated dynamically for deep links) -->
  <meta id="og-title"       property="og:title"              content="bitFossil - Search API">
  <meta id="og-description" property="og:description"        content="Discover on-chain messages, profiles, and digital objects on the Bitcoin blockchain.">
  <meta id="og-image"       property="og:image"              content="https://p2fk.io/bitfossil.png">
  <meta id="og-url"         property="og:url"                content="https://p2fk.io/">
  <meta                     property="og:type"               content="website">
  <meta                     property="og:site_name"          content="bitFossil">
  <meta id="tw-card"        name="twitter:card"              content="summary_large_image">
  <meta id="tw-title"       name="twitter:title"             content="bitFossil - Search API">
  <meta id="tw-description" name="twitter:description"       content="Discover on-chain messages, profiles, and digital objects on the Bitcoin blockchain.">
  <meta id="tw-image"       name="twitter:image"             content="https://p2fk.io/bitfossil.png">
  <meta                     name="twitter:site"              content="@bitFossil">
  <style>
    /* ── Reset & base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { overscroll-behavior: none; scroll-behavior: smooth; }
    body {
      background: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overscroll-behavior: none;
    }
    a { color: #03dac6; text-decoration: none; }
    a:hover { color: #bb86fc; }

    /* ── Top nav bar ───────────────────────────────────────────────── */
    #navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 2000;
      background: #1e1e1e;
      border-bottom: 2px solid #bb86fc;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      height: 54px;
    }
    #navbar .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      text-decoration: none;
      color: #bb86fc;
      font-size: 1.15em;
      font-weight: bold;
      cursor: pointer;
    }
    #navbar .brand img { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; }
    #search-form {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      max-width: 680px;
    }
    #navbar-search-input {
      flex: 1;
      padding: 7px 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #e0e0e0;
      border-radius: 5px;
      font-size: 0.9em;
      min-width: 0;
    }
    #navbar-search-input:focus { border-color: #bb86fc; outline: none; }
    #navbar-search-btn {
      padding: 7px 14px;
      background: #6200ea;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #navbar-search-btn:hover:not(:disabled) { background: #7c4dff; }
    #navbar-search-btn:disabled { background: #444; opacity: 0.7; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .nav-links a {
      color: #b0b0b0;
      font-size: 0.82em;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #333;
      transition: all 0.2s;
    }
    .nav-links a:hover { background: #2a2a2a; color: #bb86fc; border-color: #bb86fc; }

    /* ── Chain / type filter bar ───────────────────────────────────── */
    #filter-bar {
      position: fixed;
      top: 54px; left: 0; right: 0;
      z-index: 1900;
      background: #181818;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 10px;
      padding: 5px 14px;
      font-size: 0.8em;
    }
    #filter-bar label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #b0b0b0;
      white-space: nowrap;
    }
    #filter-bar label:hover { color: #e0e0e0; }
    #filter-bar .sep {
      width: 1px;
      height: 16px;
      background: #333;
      flex-shrink: 0;
    }
    #filter-bar .chain-label { color: #03dac6; font-weight: bold; }
    #filter-bar .type-label { color: #bb86fc; font-weight: bold; }

    /* ── Main content area ─────────────────────────────────────────── */
    #main {
      padding-top: 98px; /* navbar 54 + filter-bar ~44 */
      padding-bottom: 40px;
      min-height: 100vh;
    }

    /* ── View containers ───────────────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Search view ───────────────────────────────────────────────── */
    #view-search .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 15px 4px;
    }
    #resultCount {
      font-size: 0.82em;
      color: #b0b0b0;
      display: none;
    }
    #feed {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
    }
    #loadSentinel { height: 20px; }
    #searchLoading, #profileLoading, #objectLoading, #msgLoading {
      text-align: center;
      padding: 20px;
      color: #b0b0b0;
      font-size: 0.9em;
    }
    #searchError, #profileError, #objectError, #msgError {
      text-align: center;
      padding: 12px;
      color: #cf6679;
      font-size: 0.9em;
      display: none;
    }

    /* ── Card shared styles ────────────────────────────────────────── */
    .result-card {
      background: #1e1e1e;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      padding: 12px;
      max-width: 660px;
      width: 100%;
      position: relative;
      transition: border-color 0.2s;
    }
    .result-card:hover { border-color: #444; }
    .message-card { background: #1e1e1e; border-radius: 8px; border: 1px solid #2a2a2a; padding: 12px; max-width: 660px; width: 100%; position: relative; }
    .message-card p { margin: 5px 0; font-size: 0.9em; color: #e0e0e0; white-space: pre-wrap; word-break: break-word; }

    /* ── Profile card (in search results) ─────────────────────────── */
    .profile-result-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
    }
    .profile-result-card:hover .card-name { color: #bb86fc; }
    .card-avatar {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: #333;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-name { font-weight: bold; color: #e0e0e0; font-size: 0.95em; margin: 0 0 2px; }
    .card-bio { font-size: 0.82em; color: #b0b0b0; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 0.72em; color: #888; }

    /* ── Object card (in search results) ──────────────────────────── */
    .object-result-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
    }
    .object-result-card:hover .card-name { color: #03dac6; }
    .object-thumb {
      width: 70px;
      height: 70px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: #333;
    }

    /* ── Msg card sender header ────────────────────────────────────── */
    .msg-sender {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .msg-sender-img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    .msg-sender-name { font-size: 0.9em; font-weight: bold; color: #bb86fc; }
    .message-meta { color: #888; font-size: 0.72em; margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .message-attachments { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .message-attachments img { max-width: 100%; max-height: 280px; object-fit: cover; border-radius: 5px; background: #333; }
    .message-attachments audio { width: 100%; }
    .message-attachments video { max-width: 100%; max-height: 280px; border-radius: 5px; }
    .message-attachments .pdf-viewer { width: 100%; height: 400px; border: none; border-radius: 5px; }
    .message-attachments .video-embed { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 5px; }

    /* ── Badge chips ───────────────────────────────────────────────── */
    .badge { display: inline-block; border-radius: 3px; padding: 1px 6px; font-size: 0.68em; font-weight: bold; margin-right: 4px; vertical-align: middle; }
    .badge-message { background: #6200ea; color: #fff; }
    .badge-profile { background: #1a3a2a; color: #03dac6; border: 1px solid #03dac6; }
    .badge-object  { background: #2a1a3a; color: #bb86fc; border: 1px solid #bb86fc; }
    .badge-chain   { background: #222; color: #888; font-size: 0.65em; border: 1px solid #333; }
    .badge-pending { display: inline-block; border-radius: 3px; padding: 1px 6px; font-size: 0.68em; font-weight: bold; margin-right: 4px; vertical-align: middle; background: #3a2800; color: #ffb300; border: 1px solid #ffb300; }

    /* ── Share / copy link button ──────────────────────────────────── */
    .share-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: 1px solid #333;
      color: #888;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 0.7em;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .share-btn:hover { background: #2a2a2a; color: #03dac6; border-color: #03dac6; }
    .share-btn.copied { background: #1a3a1a; color: #4caf50; border-color: #4caf50; }
    .object-detail-card .share-btn, .object-detail-card > .share-btn { z-index: 20; }

    /* ── URN / keyword links ───────────────────────────────────────── */
    .urn-link { color: #bb86fc; cursor: pointer; text-decoration: underline; }
    .urn-link:hover { color: #7c4dff; }
    .keyword-link { color: #03dac6; cursor: pointer; }
    .keyword-link:hover { color: #bb86fc; }

    /* ── TXID copy span ────────────────────────────────────────────── */
    .txid-copy { cursor: pointer; color: #888; }
    .txid-copy:hover { color: #03dac6; }
    .refresh-date { cursor: pointer; color: #888; font-size: 0.85em; }
    .refresh-date:hover { color: #bb86fc; }

    /* ── File cards ────────────────────────────────────────────────── */
    .file-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #181818; border: 1px solid #333; border-radius: 6px; }
    .file-card:hover { border-color: #bb86fc; }
    .file-card-icon { font-size: 1.8em; width: 36px; text-align: center; flex-shrink: 0; }
    .file-card-info { flex: 1; min-width: 0; }
    .file-card-name { font-size: 0.85em; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-card-meta { font-size: 0.72em; color: #888; margin-top: 2px; }
    .file-card-download { flex-shrink: 0; padding: 5px 10px; background: #6200ea; color: #fff; border-radius: 4px; font-size: 0.78em; text-decoration: none; }
    .file-card-download:hover { background: #bb86fc; color: #121212; }

    /* ── Poll cards ────────────────────────────────────────────────── */
    .poll-card { background: #181818; border: 1px solid #444; border-radius: 8px; padding: 12px 14px; }
    .poll-card:hover { border-color: #bb86fc; }
    .poll-header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .poll-badge { background: #2a1a3a; color: #bb86fc; border: 1px solid #bb86fc; font-size: 0.72em; font-weight: bold; padding: 2px 7px; border-radius: 4px; }
    .poll-status-badge { font-size: 0.7em; font-weight: bold; padding: 2px 7px; border-radius: 4px; border: 1px solid; }
    .poll-status-open { background: #1a2a1a; color: #4caf50; border-color: #4caf50; }
    .poll-status-closed { background: #2a1a1a; color: #cf6679; border-color: #cf6679; }
    .poll-question { font-size: 0.95em; font-weight: bold; color: #e0e0e0; margin-bottom: 5px; }
    .poll-end { font-size: 0.72em; color: #666; margin-bottom: 8px; }
    .poll-gate { font-size: 0.75em; color: #888; background: #1a1a2a; border: 1px solid #2a2a44; border-radius: 4px; padding: 4px 8px; margin-bottom: 8px; }
    .poll-options { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .poll-option { background: #1e1e1e; border-radius: 6px; padding: 8px 10px; }
    .poll-option-text { font-size: 0.85em; color: #e0e0e0; margin-bottom: 5px; }
    .poll-bar-row { display: flex; align-items: center; gap: 8px; }
    .poll-bar-wrap { flex: 1; background: #2a2a2a; border-radius: 4px; height: 8px; overflow: hidden; }
    .poll-bar { height: 100%; background: linear-gradient(90deg,#6200ea,#bb86fc); border-radius: 4px; width: 0; transition: width 0.6s ease; }
    .poll-bar.winner { background: linear-gradient(90deg,#018786,#03dac6); }
    .poll-count { font-size: 0.75em; color: #666; min-width: 80px; text-align: right; font-family: monospace; white-space: nowrap; }
    .poll-count.has-votes { color: #bb86fc; }
    .poll-total { font-size: 0.75em; color: #888; text-align: right; margin-bottom: 6px; }
    .poll-vote-btn { display: block; width: 100%; padding: 7px; background: #2a1a3a; border: 1px solid #bb86fc; color: #bb86fc; border-radius: 5px; cursor: pointer; font-size: 0.82em; font-weight: bold; transition: all 0.2s; }
    .poll-vote-btn:hover { background: #3a2a4a; }
    .poll-vote-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .poll-loading { text-align: center; padding: 14px; color: #888; font-size: 0.82em; }
    .poll-error { font-size: 0.75em; color: #cf6679; text-align: center; padding: 3px 0; margin-top: 4px; }
    #view-profile, #view-object, #view-message {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 14px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #b0b0b0;
      font-size: 0.82em;
      cursor: pointer;
      margin-bottom: 14px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #333;
      background: transparent;
      transition: all 0.2s;
    }
    .back-link:hover { background: #2a2a2a; color: #bb86fc; border-color: #bb86fc; }
    .profile-panel {
      background: #1e1e1e;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      position: relative;
    }
    .profile-panel-img {
      width: 88px;
      height: 88px;
      border-radius: 8px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    .profile-panel-info { flex: 1; min-width: 0; overflow: hidden; }
    .profile-panel-info h2 { margin: 0 0 4px; color: #bb86fc; font-size: 1.1em; overflow-wrap: break-word; word-break: break-word; }
    .profile-panel-info p { margin: 2px 0; font-size: 0.85em; color: #b0b0b0; overflow-wrap: break-word; word-break: break-word; }
    .profile-handle-addr { font-family: monospace; font-size: 0.65em; color: #666; font-weight: normal; vertical-align: middle; cursor: pointer; border-bottom: 1px dotted #444; }
    .profile-handle-addr:hover { color: #03dac6; }
    .profile-msg-thread { display: flex; flex-direction: column; gap: 10px; }
    .profile-msg-thread h3 { margin: 0 0 8px; font-size: 0.9em; color: #888; font-weight: normal; }
    #profileMsgLoadMore {
      display: none;
      margin: 12px auto;
      padding: 8px 20px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #b0b0b0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85em;
    }
    #profileMsgLoadMore:hover { background: #333; color: #bb86fc; border-color: #bb86fc; }

    /* ── Object detail view ────────────────────────────────────────── */
    .object-detail-card {
      background: #1e1e1e;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      padding: 16px;
      position: relative;
    }
    .object-detail-header { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 12px; }
    .object-detail-img {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    .object-detail-info { flex: 1; min-width: 0; }
    .object-detail-info h2 { margin: 0 0 4px; color: #bb86fc; font-size: 1.15em; }
    .object-detail-info p { margin: 2px 0; font-size: 0.85em; color: #b0b0b0; }
    .object-detail-info .desc { color: #e0e0e0; margin-top: 6px; }
    .object-detail-owners { margin-top: 10px; }
    .object-detail-owners h4 { margin: 0 0 4px; font-size: 0.8em; color: #888; }
    .owner-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid #2a2a2a; font-size: 0.82em; }
    .owner-row:last-child { border-bottom: none; }
    .owner-addr { font-family: monospace; color: #03dac6; cursor: pointer; }
    .owner-addr:hover { color: #bb86fc; }
    .owner-units { color: #888; font-size: 0.9em; }

    /* ── Object detail expanded sections ───────────────────────────── */
    .obj-section { margin-top: 14px; }
    .obj-section-title { font-size: 0.78em; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 5px; font-weight: bold; }
    .obj-list { display: flex; flex-direction: column; gap: 2px; }
    .obj-list-header { display: flex; align-items: center; gap: 8px; padding: 3px 6px; background: #1a1a1a; border-radius: 4px 4px 0 0; font-size: 0.72em; color: #888; font-weight: bold; }
    .obj-list-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-bottom: 1px solid #1e1e1e; font-size: 0.82em; background: #161616; }
    .obj-list-row:last-child { border-bottom: none; border-radius: 0 0 4px 4px; }
    .obj-list-row.unack { color: #888; font-style: italic; }
    .obj-list-row.status-success { border-left: 2px solid #4caf50; }
    .obj-list-row.status-failed  { border-left: 2px solid #cf6679; }
    .obj-list-row.listing-cheapest { border-left: 2px solid #03dac6; }
    .col-name  { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .col-qty   { flex: 0 0 50px; text-align: right; color: #888; }
    .col-price { flex: 0 0 80px; text-align: right; color: #03dac6; font-family: monospace; }
    .col-pct   { flex: 0 0 46px; text-align: right; color: #bb86fc; }
    .col-date  { flex: 0 0 80px; text-align: right; color: #888; font-size: 0.9em; }
    .col-action{ flex: 0 0 70px; text-align: right; color: #b0b0b0; font-size: 0.85em; }
    .obj-addr-copy { font-family: monospace; color: #03dac6; cursor: pointer; font-size: 0.82em; }
    .obj-addr-copy:hover { color: #bb86fc; }
    .obj-lock { display: inline-block; font-size: 1em; position: relative; cursor: default; }
    .obj-lock .lock-tooltip { visibility: hidden; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); background: #333; color: #e0e0e0; padding: 3px 7px; border-radius: 4px; font-size: 0.75em; white-space: nowrap; z-index: 100; }
    .obj-lock:hover .lock-tooltip { visibility: visible; }
    .obj-refresh-btn { padding: 4px 10px; background: #1a1a1a; border: 1px solid #444; color: #b0b0b0; border-radius: 4px; cursor: pointer; font-size: 0.8em; transition: all 0.2s; }
    .obj-refresh-btn:hover { border-color: #03dac6; color: #03dac6; }
    .obj-refresh-btn.loading { animation: spin 1s linear infinite; }
    @keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
    .urn-link-row { margin-top: 6px; font-size: 0.82em; color: #b0b0b0; word-break: break-all; }
    .urn-link-row a { color: #bb86fc; }
    .urn-link-row a:hover { color: #03dac6; }
    .changelog { max-height: 200px; overflow-y: auto; }

    /* ── Profile URL links ──────────────────────────────────────────── */
    .profile-url-link { display: inline-block; border: 1px solid #bb86fc; border-radius: 10px; padding: 1px 8px; font-size: 0.75em; color: #bb86fc; cursor: pointer; margin: 2px; transition: all 0.2s; }
    .profile-url-link:hover { background: #bb86fc; color: #121212; }
    .profile-url-link.internal:hover { background: #03dac6; border-color: #03dac6; color: #121212; }
    .profile-height { font-size: 0.78em; color: #888; margin-top: 4px; }
    .profile-height span { color: #03dac6; font-weight: bold; }


    /* ── URN media preview ──────────────────────────────────────────── */
    .obj-preview { width: 100%; margin-bottom: 16px; border-radius: 8px; overflow: hidden; background: #0a0a0a; }
    .obj-preview video { width: 100%; display: block; aspect-ratio: 1/1; max-height: 500px; object-fit: contain; background: #000; }
    .obj-preview audio { width: 100%; display: block; height: 54px; background: #1e1e1e; }
    .obj-preview iframe { width: 100%; aspect-ratio: 1/1; border: none; display: block; }

<script>
'use strict';

// ── Constants ──────────────────────────────────────────────────────────
const BASE_URL = window.location.origin;
const API_FETCH_BATCH_SIZE = 200;
const DISPLAY_BATCH_SIZE = 20;
const MAX_PER_CHAIN = 1000;
const MSG_PAGE_SIZE = 20;

const CHAINS = {
  chkBitcoin:  { key: 'BTC',  params: 'blockchain=BTC'  },
  chkTestnet3: { key: 'TBTC', params: 'mainnet=false'   },
  chkLTC:      { key: 'LTC',  params: 'blockchain=LTC'  },
  chkDOG:      { key: 'DOG',  params: 'blockchain=DOG'  },
  chkMZC:      { key: 'MZC',  params: 'blockchain=MZC'  },
};

const CHAIN_UPPER_TO_API = { 'BTC':'BTC','TBTC':'BTC','LTC':'LTC','DOG':'DOG','MZC':'MZC' };



const fallbackImage = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><rect width='100%' height='100%' fill='%23333'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='11'>No Image</text></svg>";

// ── App state ──────────────────────────────────────────────────────────
const state = {
  isSearching: false,
  isLoadingMore: false,
  currentSearchId: null,
  abortController: null,
  imageCache: new Map(),
  txidMeta: new Map(),
  lastSearchText: '',
  pagination: {},
  buffer: [],
  totalDisplayed: 0,
  chainCounts: {},
  keywordMode: false,
  keywordAddress: '',
  keywordMainnet: true,
  profileMsgSkip: 0,
  profileMsgAddress: null,
  profileMsgMainnet: true,
  profileMsgExhausted: false,
  profileMsgLoading: false,
  profileMsgObserver: null,
  currentView: 'search',
};

// ── Utility helpers ────────────────────────────────────────────────────
const getQueryParam = (name) => new URLSearchParams(window.location.search).get(name);
const escapeHtml = (s) => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const abbreviateAddress = (a) => a ? `${a.slice(0,6)}...${a.slice(-4)}` : '';
const isAddress = (s) => /^[a-zA-Z0-9][a-km-zA-HJ-NP-Z1-9]{25,34}$/.test((s||'').trim());
const isTxid   = (s) => /^[0-9a-fA-F]{64}$/.test((s||'').trim());
const normalizeChain = (bc) => { const c=(bc||'').toUpperCase().trim(); return c==='BTC-TESTNET'?'TBTC':c; };

const formatDate = (d) => {
  if (!d || String(d).startsWith('0001-01-01')) return null;
  try { const x=new Date(d); return isNaN(x)?null:x.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); } catch { return null; }
};
const isNullDate = (d) => !d || String(d).startsWith('0001-01-01') || String(d).startsWith('1970-01-01'); // 0001-01-01 = .NET default; 1970-01-01 = pending (unconfirmed) sentinel

const chainToMeta = (blockchain) => {
  const c=(blockchain||'BTC').toUpperCase();
  if (c==='BTC-TESTNET'||c==='TBTC') return {mainnet:false,blockchain:'BTC'};
  if (c==='LTC'||c==='DOG'||c==='MZC') return {mainnet:true,blockchain:c};
  return {mainnet:true,blockchain:'BTC'};
};

// ── Session caches ─────────────────────────────────────────────────────
const getCachedProfile = (a) => { try{const c=sessionStorage.getItem(`p_${a}`);return c?JSON.parse(c):null;}catch{return null;} };
const cacheProfile = (a,p) => { try{sessionStorage.setItem(`p_${a}`,JSON.stringify(p));}catch{} };
const getCachedTransaction=(txid,mainnet,blockchain)=>{try{const c=sessionStorage.getItem(`tx_${txid}_${mainnet}_${blockchain}`);return c?JSON.parse(c):null;}catch{return null;}};
const cacheTransaction=(txid,mainnet,blockchain,data)=>{try{sessionStorage.setItem(`tx_${txid}_${mainnet}_${blockchain}`,JSON.stringify(data));}catch{}};
const getCachedObject=(id,mainnet)=>{try{const c=sessionStorage.getItem(`obj_${id}_${mainnet}`);return c?JSON.parse(c):null;}catch{return null;}};
const cacheObject=(id,mainnet,data)=>{try{sessionStorage.setItem(`obj_${id}_${mainnet}`,JSON.stringify(data));}catch{}};

// ── Image helpers ──────────────────────────────────────────────────────
const MAX_IMG_CACHE=100;
const cacheImage=(url,res)=>{if(state.imageCache.size>=MAX_IMG_CACHE){state.imageCache.delete(state.imageCache.keys().next().value);}state.imageCache.set(url,res);};

const resolveUrnPath=(urn)=>{
  if(!urn) return '';
  urn=urn.replace(/\\/g,'/');
  const parts=urn.split(':').pop().split('/');
  const fileParts=parts.slice(1).map(p=>encodeURIComponent(p));
  return /^(BTC|LTC|DOG|MZC):/i.test(urn)||/^[A-Za-z0-9]+\/.+/.test(urn)
    ?`${BASE_URL}/root/${parts[0]}/${fileParts.join('/')||''}`:'';
};

const getImageUrl=(image,urn)=>{
  const norm=(v)=>typeof v==='string'?v.replace(/\\/g,'/').trim():null;
  const resolve=(v)=>{
    if(!v) return null;
    const val=norm(v); if(!val) return null;
    const lo=val.toLowerCase();
    try{const u=new URL(val);if(u.protocol==='file:')return null;if(['https:','data:'].includes(u.protocol))return val.replace(/^http:\/\/bitfossil\.com\//i,`${BASE_URL}/root/`).replace(/^https?:\/\/bitfossil\.org\//i,`${BASE_URL}/root/`).replace(/^http:/i,'https:');}catch{}
    if(lo.startsWith('ipfs')){const m=val.match(/ipfs[:/]*([a-zA-Z0-9]+)/i);return m?`https://ipfs.io/ipfs/${m[1]}`:null;}
    if(/^(BTC|LTC|DOG|MZC):[0-9a-fA-F]{64}$/i.test(val)) return null;
    return /^(BTC|LTC|DOG|MZC):/i.test(val)||/^[A-Za-z0-9]+\/.+/.test(val)?resolveUrnPath(val):null;
  };
  return resolve(image)||resolve(urn)||fallbackImage;
};

const warmRootCache=async(txid,mainnet,blockchain)=>{
  if(!txid||!/^[0-9a-fA-F]{64}$/.test(txid)) return;
  const c=(blockchain||'BTC').toUpperCase();
  if(getCachedTransaction(txid,mainnet,c)) return;
  try{await fetch(c!=='BTC'?`${BASE_URL}/GetRootByTransactionID/${txid}?blockchain=${encodeURIComponent(c)}&verbose=false`:`${BASE_URL}/GetRootByTransactionID/${txid}?mainnet=${!!mainnet}&verbose=false`);}catch{}
};

const loadImageWithTimeout=async(url,timeout=180000)=>{
  if(state.imageCache.has(url)) return state.imageCache.get(url);
  if(url===fallbackImage) return url;
  let cur=url;
  try{const u=new URL(url);if(u.protocol==='file:'){cacheImage(url,fallbackImage);return fallbackImage;}if(u.protocol==='ipfs:'){const h=url.replace(/^ipfs[:/]+/i,'').split('/')[0];cur=`https://ipfs.io/ipfs/${h}`;}}catch(e){const m=url.match(/ipfs[:/]*([a-zA-Z0-9]+)/i);if(m)cur=`https://ipfs.io/ipfs/${m[1]}`;else{cacheImage(url,fallbackImage);return fallbackImage;}}
  let warmed=false;
  for(let i=0;i<3;i++){
    try{
      const res=await new Promise((ok,fail)=>{
        const img=new Image(); const t=setTimeout(()=>fail(new Error('timeout')),timeout);
        img.onload=()=>{clearTimeout(t);cacheImage(url,cur);ok(cur);};
        img.onerror=()=>{clearTimeout(t);fail(new Error('err'));};
        if(!cur.includes('p2fk.io/root'))img.crossOrigin='Anonymous';
        img.src=cur;
      });
      return res;
    }catch{
      if(!warmed&&url.includes('p2fk.io/root')){warmed=true;const m=url.match(/\/root\/([0-9a-fA-F]{64})\//i);if(m){const{mainnet,blockchain}=state.txidMeta.get(m[1])||{mainnet:true,blockchain:'BTC'};await warmRootCache(m[1],mainnet,blockchain);i--;continue;}}
      if(i===2){cacheImage(url,fallbackImage);return fallbackImage;}
      await new Promise(r=>setTimeout(r,800));
    }
  }
  return fallbackImage;
};

// ── API fetch helper ───────────────────────────────────────────────────
const fetchAPI=async(url,errMsg,signal,timeout=15000)=>{
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),timeout);
  try{
    const res=await fetch(url,{signal:signal||ctrl.signal});
    clearTimeout(tid);
    if(!res.ok) throw new Error(errMsg||`HTTP ${res.status}`);
    return res.json();
  }catch(e){clearTimeout(tid);if(e.name==='AbortError') return null;throw e;}
};

const fetchProfileByAddress=async(address,mainnet,signal)=>{
  if(!isAddress(address)) return null;
  const cached=getCachedProfile(address);
  if(cached) return cached;
  try{const p=await fetchAPI(`${BASE_URL}/GetProfileByAddress/${encodeURIComponent(address)}?mainnet=${mainnet}`,'',signal);if(p) cacheProfile(address,p);return p;}catch{return null;}
};

const fetchProfileByURN=async(urn,mainnet,signal)=>{
  const cached=getCachedProfile(`urn_${urn}_${mainnet}`);
  if(cached) return cached;
  try{const p=await fetchAPI(`${BASE_URL}/GetProfileByURN/${encodeURIComponent(urn)}?mainnet=${mainnet}`,'',signal);if(p) cacheProfile(`urn_${urn}_${mainnet}`,p);return p;}catch{return null;}
};

// Extract the owner address from any profile object (handles both array and object Creators shapes)
const _getProfileCreatorAddr=(profile)=>{
  if(!profile) return '';
  const c=profile.Creators;
  if(Array.isArray(c)) return c.find(a=>typeof a==='string'&&a.length>10)||'';
  if(c&&typeof c==='object') return Object.keys(c).find(k=>k!=='0'&&k.length>10)||'';
  return '';
};
// Async URN legitimacy check: returns true if the profile's address matches what GetProfileByURN says
const _officialCache=new Map();
const _isOfficialProfile=async(urn,address,mainnet)=>{
  if(!urn||!address) return true; // can't verify → treat as ok
  const key=`${urn}_${address}_${mainnet}`;
  if(_officialCache.has(key)) return _officialCache.get(key);
  try{
    const official=await fetchProfileByURN(urn,mainnet,null);
    const officialAddr=_getProfileCreatorAddr(official);
    if(!officialAddr) return true; // can't determine → treat as ok (don't cache uncertain state)
    const result=officialAddr===address;
    _officialCache.set(key,result);
    return result;
  }catch{return true;}
};

// ── File utilities ─────────────────────────────────────────────────────
const getFileCardIcon=(ext)=>{
  if(/^(zip|tar|gz|bz2|xz|rar|7z|tgz)$/.test(ext)) return '📦';
  if(/^(doc|docx|odt|rtf)$/.test(ext)) return '📝';
  if(/^(xls|xlsx|ods|csv)$/.test(ext)) return '📊';
  if(/^(txt|log|md)$/.test(ext)) return '📃';
  if(/^(js|ts|py|java|c|cpp|cs|go|rs|php|rb|sh)$/.test(ext)) return '💻';
  if(/^(json|xml|yaml|yml|toml|ini|cfg)$/.test(ext)) return '🔧';
  if(!ext) return '🔗';
  return '📎';
};
const formatBytes=(n)=>{n=Number(n);if(!isFinite(n)||n<0)return null;if(!n)return '0 B';const mb=n/1048576,kb=n/1024;return mb>=1?`${mb.toFixed(1)} MB`:kb>=1?`${kb.toFixed(1)} KB`:`${n} B`;};
const fetchFileSize=async(url,el)=>{try{const r=await fetch(url,{method:'HEAD',signal:AbortSignal.timeout(8000)});const l=r.headers.get('content-length');el.textContent=l?(formatBytes(parseInt(l,10))||'Size unknown'):'Size unknown';}catch{el.textContent='Size unavailable';}};

// ── Share link helpers ─────────────────────────────────────────────────
const buildShareUrl=(type,params)=>{
  const base=`${window.location.origin}/`;
  const p=new URLSearchParams({[type]:params.id});
  if(params.mainnet===false||params.mainnet==='false') p.set('mainnet','false');
  if(params.blockchain&&params.blockchain!=='BTC') p.set('blockchain',params.blockchain);
  return base+'?'+p.toString();
};

const makeShareBtn=(type,params)=>{
  const btn=document.createElement('button');
  btn.className='share-btn';
  btn.title='Copy shareable link';
  btn.innerHTML='🔗 Share';
  btn.addEventListener('click',async(e)=>{
    e.stopPropagation(); e.preventDefault();
    const url=buildShareUrl(type,params);
    try{await navigator.clipboard.writeText(url);}catch{
      const ta=document.createElement('textarea');ta.value=url;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    }
    btn.textContent='✅ Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.innerHTML='🔗 Share';btn.classList.remove('copied');},2200);
  });
  return btn;
};

// ── URN link creation ──────────────────────────────────────────────────
const createUrnLink=(text,address)=>{
  if(!text) return '';
  const s=escapeHtml(text),a=escapeHtml(address);
  return `<span class="urn-link" data-urn="${a}">${s}</span>`;
};

// ── Message parsing ────────────────────────────────────────────────────
const parseMessage=async(messageText,mainnet,signal)=>{
  const attachments=[],links=[];
  const urnRegex=/@([A-Za-z0-9]+(?:\/[A-Za-z0-9]+)?)/g;
  const keywordRegex=/#([\w]+)/g;
  let clean=messageText.replace(/<<[^>]+>>/g,'').trim();
  const attMatches=messageText.match(/<<[^>]+>>/g)||[];
  attMatches.forEach(m=>{
    const c=m.slice(2,-2).replace(/\s+/g,'').trim();
    if(c.match(/^-?\d+$/)||c.match(/#[\w\s#]+/)||c.match(/^#[\w\s]+$/)) return;
    if(!/^IPFS:/i.test(c)&&!/^[0-9a-f]{64}(?:[/\\]|$)/i.test(c)&&!/^https?:\/\//i.test(c)) return;
    if(/^https?:\/\//i.test(c)) links.push(c);
    else attachments.push(c);
  });
  const parsedAtt=attachments.map(a=>{const p=a.split(/[/\\]/);return{hash:p[0].replace(/^IPFS:/i,'').trim(),filename:p[1]||p[0].replace(/^IPFS:/i,'').trim()};});
  const parsedLinks=links.map(u=>({url:u}));
  for(const m of [...clean.matchAll(urnRegex)]){
    const urn=m[1];
    if(!/^[a-zA-Z0-9]{26,35}$/.test(urn)&&!/^[a-zA-Z0-9]+\/[a-zA-Z0-9]+$/.test(urn)) continue;
    const p=await fetchProfileByAddress(urn,mainnet,signal);
    if(!p) continue;
    clean=clean.replace(m[0],createUrnLink(p.DisplayName||p.URN||urn,urn));
  }
  for(const m of [...clean.matchAll(keywordRegex)]){
    clean=clean.replace(`#${m[1]}`,`<span class="keyword-link" data-keyword="${escapeHtml(m[1])}">#${escapeHtml(m[1])}</span>`);
  }
  return{cleanMessage:clean,attachments:parsedAtt,links:parsedLinks};
};

// ── Poll card renderer ─────────────────────────────────────────────────
const fmtVotes=(n)=>{if(n==null)return'—';const v=Number(n);return isFinite(v)?v.toLocaleString():'—';};
const renderPollCard=(el,queAddr,queText,endBlock,answers,mainnet,downloadUrl)=>{
  console.log('[INQ] renderPollCard → addr:',queAddr,'mainnet:',mainnet,'endBlock:',endBlock,'answers:',answers.length);
  const optHtml=answers.map(a=>`<div class="poll-option" data-addr="${escapeHtml(a.addr)}"><div class="poll-option-text">${escapeHtml(a.text)}</div><div class="poll-bar-row"><div class="poll-bar-wrap"><div class="poll-bar"></div></div><span class="poll-count">—</span></div></div>`).join('');
  const endHtml=endBlock?`<div class="poll-end">Ends at block ${escapeHtml(String(endBlock))}</div>`:'';
  el.innerHTML=`<div class="poll-card"><div class="poll-header"><span class="poll-badge">📊 Poll</span><span class="poll-status"></span></div><div class="poll-question">${escapeHtml(queText)}</div>${endHtml}<div class="poll-gate" style="display:none"></div><div class="poll-options">${optHtml}</div><div class="poll-total" style="display:none"></div><button class="poll-vote-btn" style="display:none">Calculate</button><div class="poll-error" style="display:none"></div></div>`;
  // Populate vote bars from AnswerData (works for both verbose and non-verbose once totals are present)
  const applyVoteData=(r)=>{
    if(!r||!Array.isArray(r.AnswerData)||!r.AnswerData.length) return false;
    const totMap={};
    r.AnswerData.forEach(a=>{totMap[a.Address]={votes:(a.TotalVotes||0)+(a.TotalGatedVotes||0),value:(a.TotalValue||0)+(a.TotalGatedValue||0)};});
    const grandTotal=r.AnswerData.reduce((s,a)=>s+(a.TotalVotes||0)+(a.TotalGatedVotes||0),0);
    const maxVotes=Math.max(...r.AnswerData.map(a=>(a.TotalVotes||0)+(a.TotalGatedVotes||0)),1);
    el.querySelectorAll('.poll-option').forEach(opt=>{
      const t=totMap[opt.dataset.addr];if(!t) return;
      const pct=grandTotal>0?(t.votes/grandTotal*100).toFixed(1):'0.0';
      const bar=opt.querySelector('.poll-bar');
      bar.style.width=`${pct}%`;
      if(t.votes===maxVotes&&t.votes>0) bar.classList.add('winner'); else bar.classList.remove('winner');
      const cEl=opt.querySelector('.poll-count');
      cEl.textContent=`${fmtVotes(t.votes)} (${pct}%)`;cEl.classList.add('has-votes');
    });
    const gTotal=(r.TotalVotes||0)+(r.TotalGatedVotes||0);
    const gVal=(r.TotalValue||0)+(r.TotalGatedValue||0);
    const totalEl=el.querySelector('.poll-total');
    totalEl.textContent=`Total: ${fmtVotes(gTotal)} votes${gVal?' · '+fmtVotes(gVal)+' value':''}`;
    totalEl.style.display='';
    return gTotal>0;
  };
  const btn=el.querySelector('.poll-vote-btn');
  const errEl=el.querySelector('.poll-error');
  btn.textContent='Calculate';
  // verbose=true fetch — triggered automatically for closed polls with no cached totals, or by the Calculate button
  const runVerboseFetch=async()=>{
    const vUrl=`${BASE_URL}/GetInquiryByAddress/${encodeURIComponent(queAddr)}?mainnet=${mainnet}&verbose=true`;
    console.log('[INQ] verbose=true fetch →',vUrl);
    btn.disabled=true;btn.textContent='⏳ Calculating…';errEl.style.display='none';
    try{
      const r=await fetchAPI(vUrl,'',null,180000);
      console.log('[INQ] verbose=true response:',r);
      if(!r||typeof r!=='object') throw new Error('No data returned');
      applyVoteData(r);
      const stillOpen=r.status==='open';
      btn.textContent='Calculate';btn.disabled=false;
      if(!stillOpen) btn.style.display='none';
    }catch(e){
      console.error('[INQ] verbose=true error:',e);
      errEl.textContent='Failed: '+(e.message||'Unknown error');errEl.style.display='';
      btn.textContent='Calculate';btn.disabled=false;
    }
  };
  btn.addEventListener('click',()=>{console.log('[INQ] Calculate button clicked for',queAddr);runVerboseFetch();});
  // Build gate banner with clickable object NME / profile names (async-resolved)
  const buildGateBanner=(r)=>{
    const gEl=el.querySelector('.poll-gate');
    const frag=document.createDocumentFragment();
    frag.appendChild(document.createTextNode('🔒 '));
    let first=true;
    const sep=()=>{if(!first) frag.appendChild(document.createTextNode(' · '));first=false;};
    if(r.OwnsObjectGate){
      const arr=Array.isArray(r.OwnsObjectGate)?r.OwnsObjectGate:[r.OwnsObjectGate];
      if(arr.length){
        sep();frag.appendChild(document.createTextNode('Must own object: '));
        arr.forEach((rawAddr,i)=>{
          if(i>0) frag.appendChild(document.createTextNode(', '));
          const addr=String(rawAddr);
          const sp=document.createElement('span');sp.className='urn-link';sp.textContent=abbreviateAddress(addr);
          sp.addEventListener('click',(e)=>{e.stopPropagation();navigateTo('object',{object:addr,mainnet});});
          frag.appendChild(sp);
          fetchAPI(`${BASE_URL}/GetObjectByAddress/${encodeURIComponent(addr)}?mainnet=${mainnet}&verbose=false`,'',null)
            .then(obj=>{const o=Array.isArray(obj)?obj[0]:obj;if(o&&o.Name) sp.textContent=o.Name;}).catch(()=>{});
        });
      }
    }
    if(r.OwnsCreatedByGate){
      const arr=Array.isArray(r.OwnsCreatedByGate)?r.OwnsCreatedByGate:[r.OwnsCreatedByGate];
      if(arr.length){
        sep();frag.appendChild(document.createTextNode('Created by: '));
        arr.forEach((rawAddr,i)=>{
          if(i>0) frag.appendChild(document.createTextNode(', '));
          const addr=String(rawAddr);
          const sp=document.createElement('span');sp.className='urn-link';sp.textContent=abbreviateAddress(addr);
          sp.addEventListener('click',(e)=>{e.stopPropagation();navigateTo('profile',{profile:addr,mainnet});});
          frag.appendChild(sp);
          fetchProfileByAddress(addr,mainnet,null)
            .then(p=>{if(p&&(p.DisplayName||p.URN)) sp.textContent=p.DisplayName||p.URN;}).catch(()=>{});
        });
      }
    }
    if(Array.isArray(r.AuthorizedByGate)&&r.AuthorizedByGate.length) {sep();frag.appendChild(document.createTextNode(`Authorized: ${r.AuthorizedByGate.length} address${r.AuthorizedByGate.length>1?'es':''}`));}
    if(r.RequireSignature){sep();frag.appendChild(document.createTextNode('Signature required'));}
    if(!first){gEl.innerHTML='';gEl.appendChild(frag);gEl.style.display='';}
  };
  // Initial load: verbose=false (fast; returns cached totals if a verbose run has been done before)
  const initUrl=`${BASE_URL}/GetInquiryByAddress/${encodeURIComponent(queAddr)}?mainnet=${mainnet}&verbose=false`;
  console.log('[INQ] initial verbose=false fetch →',initUrl);
  fetchAPI(initUrl,'',null,15000).then(r=>{
    console.log('[INQ] verbose=false response:',r);
    if(!r||typeof r!=='object'){console.warn('[INQ] no data from verbose=false, showing Calculate button');btn.style.display='';return;}
    const statusEl=el.querySelector('.poll-status');
    const isOpen=r.status==='open';
    if(r.status){statusEl.textContent=isOpen?'OPEN':'CLOSED';statusEl.className=`poll-status-badge ${isOpen?'poll-status-open':'poll-status-closed'}`;}
    if(r.MaxBlockHeight&&!endBlock){const d=el.querySelector('.poll-end');if(d)d.textContent=`Ends at block ${r.MaxBlockHeight.toLocaleString()}`;}
    buildGateBanner(r);
    let hasTotals=false;
    try{hasTotals=applyVoteData(r);}catch(_){}
    console.log('[INQ] hasTotals:',hasTotals,'isOpen:',isOpen);
    // Show Calculate button whenever there are no totals yet (open or closed) so user can trigger the verbose=true scan on demand
    if(isOpen||!hasTotals) btn.style.display='';
    // else: closed + totals already present → keep button hidden (results are final)
  }).catch((e)=>{console.error('[INQ] verbose=false error:',e);btn.style.display='';});
};

// ── Attachment renderer ────────────────────────────────────────────────
const renderAttachments=(container,attachments,links,blockchain)=>{
  const audioMime={mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac',webm:'audio/webm',aac:'audio/aac',m4a:'audio/mp4',opus:'audio/opus'};
  const videoMime={mp4:'video/mp4',avi:'video/x-msvideo',mov:'video/quicktime'};
  const imgEls=[];
  for(const{hash,filename}of attachments){
    const isTx=/^[0-9a-f]{64}$/i.test(hash);
    const url=isTx?`${BASE_URL}/root/${hash}/${encodeURIComponent(filename)}`:`https://ipfs.io/ipfs/${hash}`;
    if(isTx) state.txidMeta.set(hash,chainToMeta(blockchain));
    // INQ poll card
    if(filename.toUpperCase()==='INQ'&&isTx){
      const el=document.createElement('div');
      el.innerHTML='<div class="poll-loading">Loading poll…</div>';
      container.appendChild(el);
      const pollMainnet=chainToMeta(blockchain).mainnet;
      console.log('[INQ] detected INQ file txid:',hash,'blockchain:',blockchain,'pollMainnet:',pollMainnet,'url:',url);
      (async()=>{
        try{
          console.log('[INQ] fetching INQ file →',url);
          const res=await fetch(url);if(!res.ok) throw new Error(res.status);
          const d=await res.json();
          console.log('[INQ] INQ file data:',d);
          if(!d||typeof d!=='object'||!d.que||!d.ans) throw new Error('bad format');
          const queAddr=Object.keys(d.que)[0]||'';
          const queText=String(Object.values(d.que)[0]||'');
          const endBlock=d.end||null;
          const answers=Object.entries(d.ans).map(([addr,text])=>({addr,text:String(text)}));
          renderPollCard(el,queAddr,queText,endBlock,answers,pollMainnet,url);
        }catch(err){
          console.error('[INQ] failed to load INQ file:',err,'url:',url);
          el.innerHTML=`<div class="file-card"><div class="file-card-icon">🗳️</div><div class="file-card-info"><div class="file-card-name" title="INQ">INQ</div><div class="file-card-meta"><span>Poll File</span> · <span class="file-card-size">Fetching…</span></div></div><a class="file-card-download" href="${url}" target="_blank" rel="noopener">Download</a></div>`;
          fetchFileSize(url,el.querySelector('.file-card-size'));
        }
      })();
      continue;
    }
    const ext=(filename.match(/\.([^.]+)$/)||[])[1]?.toLowerCase()||'';
    const isImg=/^(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(ext);
    const isAud=/^(mp3|wav|ogg|flac|webm|aac|m4a|opus)$/.test(ext);
    const isVid=/^(mp4|avi|mov)$/.test(ext);
    const el=document.createElement('div');
    if(isImg){el.innerHTML=`<img class="media-placeholder" src="${fallbackImage}" alt="Attachment" style="max-width:100%;max-height:280px;border-radius:5px;">`;imgEls.push({img:el.querySelector('img'),url});}
    else if(isAud){el.innerHTML=`<audio controls style="width:100%"><source src="${url}" type="${audioMime[ext]||'audio/wav'}">Audio not supported.</audio>`;}
    else if(isVid){el.innerHTML=`<video controls style="max-width:100%;max-height:280px;border-radius:5px"><source src="${url}" type="${videoMime[ext]||'video/mp4'}">Video not supported.</video>`;}
    else if(ext==='pdf'){el.innerHTML=`<iframe class="pdf-viewer" src="${url}" title="${escapeHtml(filename)}"></iframe>`;}
    else{
      const icon=getFileCardIcon(ext);
      const safe=escapeHtml(filename);
      el.innerHTML=`<div class="file-card"><div class="file-card-icon">${icon}</div><div class="file-card-info"><div class="file-card-name" title="${safe}">${safe}</div><div class="file-card-meta"><span>${escapeHtml(ext?ext.toUpperCase()+' File':'File')}</span> · <span class="file-card-size">Fetching…</span></div></div><a class="file-card-download" href="${url}" target="_blank" rel="noopener">Download</a></div>`;
      fetchFileSize(url,el.querySelector('.file-card-size'));
    }
    container.appendChild(el);
  }
  for(const{url}of links){
    const ext=(url.match(/\.([^./?#]+)(?:[?#].*)?$/)||[])[1]?.toLowerCase()||'';
    const isImg=/^(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(ext);
    const yt=url.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    const el=document.createElement('div');
    if(yt){el.innerHTML=`<iframe class="video-embed" src="https://www.youtube.com/embed/${yt[1]}" title="YouTube" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>`;}
    else if(isImg){el.innerHTML=`<img src="${fallbackImage}" alt="Image" style="max-width:100%;max-height:280px;border-radius:5px;">`;imgEls.push({img:el.querySelector('img'),url});}
    else{
      let display=url;try{const u=new URL(url);display=u.hostname+(u.pathname!=='/'?u.pathname:'');}catch{}
      el.innerHTML=`<div class="file-card"><div class="file-card-icon">${ext==='pdf'?'📄':getFileCardIcon(ext)}</div><div class="file-card-info"><div class="file-card-name" title="${escapeHtml(url)}">${escapeHtml(display)}</div><div class="file-card-meta"><span>${escapeHtml(ext?ext.toUpperCase()+' File':'Link')}</span> · <span class="file-card-size">Fetching…</span></div></div><a class="file-card-download" href="${escapeHtml(url)}" target="_blank" rel="noopener">Open</a></div>`;
      fetchFileSize(url,el.querySelector('.file-card-size'));
    }
    container.appendChild(el);
  }
  for(const{img,url}of imgEls) loadImageWithTimeout(url).then(r=>{img.src=r;}).catch(()=>{});
};

// ── Root normalizer ────────────────────────────────────────────────────
const normalizeRoot=(root)=>{
  if(!root||typeof root!=='object') return null;
  const rawMsg=root['Message']??root.Message??'';
  const msg=Array.isArray(rawMsg)?rawMsg.join('\n'):String(rawMsg??'');
  const signedBy=root['Signed By']??root.SignedBy??'';
  const blockDate=root['Block Date']??root.BlockDate??'';
  const txId=root['Transaction Id']??root.TransactionId??root['Transaction ID']??'';
  const outputObj=root['Output']??root.Output??{};
  const outputAddresses=Object.keys(outputObj);
  const numOut=outputAddresses.length;
  const toAddresses=numOut>1?outputAddresses.slice(Math.max(0,numOut-3),numOut-1):[];
  const rawFile=root['File']??root.File??null;
  const files=(rawFile&&typeof rawFile==='object'&&!Array.isArray(rawFile))?Object.keys(rawFile).filter(f=>f&&f!=='SIG'):[];
  const confirmations=root.Confirmations??root['Confirmations']??null;
  return{message:msg,fromAddress:signedBy,toAddresses,blockDate,txId,files,confirmations};
};

// ── Message card renderer ──────────────────────────────────────────────
const renderMessageCard=async(normalized,signal,blockchain,shareParams)=>{
  const chainUpper=(blockchain||'').toUpperCase();
  const mainnet=(chainUpper==='BTC-TESTNET'||chainUpper==='TBTC')?false:true;
  const{cleanMessage,attachments,links}=await parseMessage(normalized.message,mainnet,signal);
  if(normalized.txId&&normalized.files?.length){for(const f of normalized.files)if(f)attachments.push({hash:normalized.txId,filename:f});}

  const fromProfile=await fetchProfileByAddress(normalized.fromAddress,mainnet,signal);
  const fromName=fromProfile?(fromProfile.DisplayName||fromProfile.URN||abbreviateAddress(normalized.fromAddress)):abbreviateAddress(normalized.fromAddress);
  const senderImgUrl=fromProfile?getImageUrl(fromProfile.Image,fromProfile.URN):fallbackImage;
  const toLinks=await Promise.all(normalized.toAddresses.map(async a=>{
    const p=await fetchProfileByAddress(a,mainnet,signal);
    return createUrnLink(p?(p.DisplayName||p.URN||abbreviateAddress(a)):abbreviateAddress(a),a);
  }));

  const card=document.createElement('div');

  // Sender
  const senderDiv=document.createElement('div');

  const txidSender=senderImgUrl.match(/\/root\/([0-9a-fA-F]{64})\//i)?.[1];
  if(txidSender) state.txidMeta.set(txidSender,chainToMeta(blockchain));
  const sn=document.createElement('span');sn.className='msg-sender-name';sn.innerHTML=createUrnLink(fromName,normalized.fromAddress);
  senderDiv.appendChild(si);senderDiv.appendChild(sn);
  card.appendChild(senderDiv);

  // Body
  const msgP=document.createElement('p');msgP.innerHTML=cleanMessage||'No message content';card.appendChild(msgP);

  // Attachments
  const ad=document.createElement('div');ad.className='message-attachments';
  renderAttachments(ad,attachments,links,blockchain);card.appendChild(ad);

  // Meta
  const meta=document.createElement('div');meta.className='message-meta';
  const validApiChains=['BTC','LTC','DOG','MZC'];
  const apiIsTestnet=!mainnet;
  const apiChain=apiIsTestnet?'BTC':(validApiChains.includes(chainUpper)?chainUpper:'BTC');
  const nullDate=isNullDate(normalized.blockDate);
  const isPending=normalized.confirmations===0;
  const refreshAttr=normalized.txId?` <span class="refresh-date" data-txid="${escapeHtml(normalized.txId)}" data-apichain="${escapeHtml(apiChain)}" data-mainnet="${!apiIsTestnet}" title="Refresh block date">🔄 Refresh</span>`:'';
  const dateHtml=isPending?`<span class="badge-pending">⏳ Pending</span>${refreshAttr}`:nullDate?`<span class="msg-date">Unknown</span>${refreshAttr}`:`<span class="msg-date">${escapeHtml(normalized.blockDate)}</span>`;
  const txidHtml=normalized.txId?` <span class="txid-copy" data-txid="${escapeHtml(normalized.txId)}" title="Copy TX ID">📋 ${escapeHtml(normalized.txId.slice(0,8))}…</span>`:'';
  meta.innerHTML=`From: ${createUrnLink(fromName,normalized.fromAddress)}${toLinks.length?` | To: ${toLinks.join(', ')}`:''}${normalized.txId?' |':''} ${dateHtml}${txidHtml}`;
  card.appendChild(meta);

  // Click handler
  card.addEventListener('click',async(e)=>{
    const urnEl=e.target.closest('.urn-link');

    else if(kwEl){e.preventDefault();const kw=kwEl.dataset.keyword;navigateTo('search',{search:'#'+kw});}
    else if(copyEl){e.preventDefault();e.stopPropagation();const t=copyEl.dataset.txid;try{await navigator.clipboard.writeText(t);}catch{};const prev=copyEl.innerHTML;copyEl.textContent='✅';setTimeout(()=>{copyEl.innerHTML=prev;},2000);}
    else if(refreshEl){
      e.preventDefault();e.stopPropagation();

      try{const r=await fetchAPI(`${BASE_URL}/GetRootByTransactionID/${encodeURIComponent(t)}?mainnet=${mn}&blockchain=${ac}`,'',null);
        const root=Array.isArray(r)?r[0]:r;
        const nd=(root&&typeof root==='object')?(root['Block Date']??root.BlockDate??''):'';
        if(nd&&!isNullDate(nd)){cacheTransaction(t,mn,ac,root);const de=meta.querySelector('.msg-date');const pe=meta.querySelector('.badge-pending');if(de)de.textContent=nd;else if(pe){const nde=document.createElement('span');nde.className='msg-date';nde.textContent=nd;pe.replaceWith(nde);}refreshEl.remove();}
        else{refreshEl.textContent='❌';setTimeout(()=>{refreshEl.textContent='🔄 Refresh';refreshEl.style.pointerEvents='';},3000);}
      }catch{refreshEl.textContent='❌';setTimeout(()=>{refreshEl.textContent='🔄 Refresh';refreshEl.style.pointerEvents='';},3000);}
    }
  });
  return card;
};

// ── Profile card (search results) ─────────────────────────────────────
const renderProfileCard=(profile,blockchain)=>{
  const chainUpper=normalizeChain(blockchain);
  const mainnet=chainUpper!=='TBTC';
  const imgUrl=getImageUrl(profile.Image,profile.URN);
  const txm=imgUrl.match(/\/root\/([0-9a-fA-F]{64})\//i)?.[1];
  if(txm) state.txidMeta.set(txm,chainToMeta(blockchain));

  // Prefer _address (injected from search service folder path), then Creators key, then URN
  // Creators can be an array (GetProfileByURN) or an object (other endpoints); handle both.
  const _pc=profile.Creators;
  const address=profile._address||profile.Address||(Array.isArray(_pc)?_pc.find(a=>typeof a==='string'&&a.length>10)||'':Object.keys(_pc||{}).find(k=>k!=='0'&&k.length>10)||'');
  const navId=address||profile.URN||'';

  card.appendChild(img);

  body.innerHTML=`<p class="card-name">${escapeHtml(profile.DisplayName||profile.URN||'Unknown')} <span class="badge badge-profile">Profile</span><span class="badge badge-chain">${escapeHtml(blockchain||'')}</span></p><p class="card-bio">${escapeHtml((profile.Bio||'').substring(0,100))}</p><p class="card-meta">${navId?escapeHtml(abbreviateAddress(navId)):''} ${formatDate(profile.CreatedDate)||''}</p>`;
  card.appendChild(body);

  // Async URN verification: if the address doesn't match GetProfileByURN Creators → show NOT OFFICIAL
  if(profile.URN&&address){
    _isOfficialProfile(profile.URN,address,mainnet).then(official=>{
      if(!official){
        const banner=document.createElement('span');
        banner.className='not-official-banner';
        banner.textContent='[ NOT OFFICIAL ]';
        body.appendChild(banner);
      }
    });
  }

  card.addEventListener('click',(e)=>{if(e.target.closest('.share-btn')) return;if(navId) navigateTo('profile',{profile:navId,mainnet});});
  return card;
};

// ── Search pagination helpers ──────────────────────────────────────────
const allExhausted=()=>Object.values(state.pagination).every(p=>p.exhausted)&&state.buffer.length===0;
const anyMoreNeeded=()=>Object.values(state.pagination).some(p=>!p.exhausted)||state.buffer.length>0;
const updateResultCount=()=>{const n=state.totalDisplayed;const rc=document.getElementById('resultCount');if(n){rc.textContent=`${n} result${n===1?'':'s'} found`;rc.style.display='block';}};
const endpointForType=(type)=>type==='objects'?'GetKnownObjectsBySearchString':type==='profiles'?'GetKnownProfilesBySearchString':'GetKnownRootsBySearchString';

const fetchNextPage=async(signal)=>{
  const pending=Object.entries(state.pagination).filter(([,p])=>!p.exhausted);
  if(!pending.length) return{objectResults:[],profileResults:[],rootResults:[]};
  const raw=await Promise.all(pending.map(([key])=>{
    const[type]=key.split(':',2);const p=state.pagination[key];
    if(state.keywordMode){
      const addr=state.keywordAddress;const mn=state.keywordMainnet;
      if(type==='objects') return fetchAPI(`${BASE_URL}/GetObjectsByAddress/${encodeURIComponent(addr)}?mainnet=${mn}&skip=${p.skip}&qty=${API_FETCH_BATCH_SIZE}&verbose=false`,'',signal).catch(()=>[]);
      if(type==='profiles') return fetchAPI(`${BASE_URL}/GetProfileByAddress/${encodeURIComponent(addr)}?mainnet=${mn}`,'',signal).catch(()=>null);
      return fetchAPI(`${BASE_URL}/GetPublicMessagesByAddress/${encodeURIComponent(addr)}?mainnet=${mn}&skip=${p.skip}&qty=${API_FETCH_BATCH_SIZE}`,'',signal).catch(()=>[]);
    }
    return fetchAPI(`${BASE_URL}/${endpointForType(type)}?searchString=${encodeURIComponent(state.lastSearchText)}&qty=${API_FETCH_BATCH_SIZE}&skip=${p.skip}&${p.params}&showSystemFiles=${document.getElementById('chkSystem')?.checked??false}`,'',signal).catch(()=>[]);
  }));
  pending.forEach(([key],i)=>{
    const[type]=key.split(':',2);
    if(state.keywordMode){
      if(type==='profiles'){state.pagination[key].exhausted=true;return;}
      const len=Array.isArray(raw[i])?(raw[i]||[]).length:0;
      state.pagination[key].skip+=len;if(len<API_FETCH_BATCH_SIZE)state.pagination[key].exhausted=true;
    }else{
      const len=(raw[i]||[]).length;state.pagination[key].skip+=len;if(len<API_FETCH_BATCH_SIZE)state.pagination[key].exhausted=true;
    }
  });
  const objectResults=[],profileResults=[],rootResults=[];
  const kwChain=state.keywordMode?(state.keywordMainnet?'BTC':'BTC-TESTNET'):'';
  pending.forEach(([key],i)=>{
    const[type]=key.split(':',2);const r=raw[i];
    if(state.keywordMode){
      if(type==='objects'){const arr=Array.isArray(r)?r:[];objectResults.push(...arr.map(item=>{const o=item.Object||item.object||item;return{Object:o,Blockchain:kwChain};}));}
      else if(type==='profiles'){if(r&&typeof r==='object'&&!Array.isArray(r)) profileResults.push({Profile:r,Blockchain:kwChain,Address:state.keywordAddress});}
      else{const arr=Array.isArray(r)?r:[];rootResults.push(...arr.map(item=>{const root=item.Root||item.root||item;return{Root:root,Blockchain:kwChain};}));}
    }else{
      if(type==='objects')objectResults.push(...(r||[]));
      else if(type==='profiles')profileResults.push(...(r||[]));
      else rootResults.push(...(r||[]));
    }
  });
  return{objectResults,profileResults,rootResults};
};

// ── Append search results ──────────────────────────────────────────────
const appendResultItems=async(objectResults,profileResults,rootResults,searchId,signal)=>{
  // Normalize newly fetched items and add them to the shared buffer
  for(const r of(objectResults||[])){const o=r.Object||r.object;if(!o||!o.Name) continue;state.buffer.push({type:'object',raw:o,blockchain:r.Blockchain||r.blockchain||''});}
  for(const r of(profileResults||[])){const p=r.Profile||r.profile;if(!p) continue;if(!p.DisplayName&&!p.URN) continue;if(r.Address||r.address) p._address=r.Address||r.address;state.buffer.push({type:'profile',raw:p,blockchain:r.Blockchain||r.blockchain||''});}
  for(const r of(rootResults||[])){const root=r.Root||r.root;if(!root) continue;const n=normalizeRoot(root);if(!n) continue;state.buffer.push({type:'message',data:n,blockchain:r.Blockchain||r.blockchain||''});}
  // Keep buffer sorted by date descending so we always display the newest first
  state.buffer.sort((a,b)=>{
    const getD=item=>{
      if(item.type==='message'){const bd=item.data.blockDate;return(bd&&!isNullDate(bd))?new Date(bd):new Date(Date.now());}
      return new Date(item.raw?.CreatedDate||0);
    };
    return getD(b).getTime()-getD(a).getTime();
  });
  // Render up to DISPLAY_BATCH_SIZE items from the front of the buffer
  const feed=document.getElementById('feed');
  let rendered=0;
  let idx=0;
  while(idx<state.buffer.length&&rendered<DISPLAY_BATCH_SIZE){
    if(state.currentSearchId!==searchId) break;
    const item=state.buffer[idx];
    const ch=normalizeChain(item.blockchain);
    // Discard saturated-chain items immediately (don't keep re-checking them)
    if((state.chainCounts[ch]||0)>=MAX_PER_CHAIN){idx++;continue;}
    state.chainCounts[ch]=(state.chainCounts[ch]||0)+1;
    rendered++;
    idx++;  // advance before async work so the splice below always covers this item
    let card;
    if(item.type==='object') card=renderObjectCard(item.raw,item.blockchain);
    else if(item.type==='profile') card=renderProfileCard(item.raw,item.blockchain);
    else{ card=await renderMessageCard(item.data,signal,item.blockchain); if(state.currentSearchId!==searchId) break; }
    card.dataset.chain=ch;
    feed.appendChild(card);
  }
  // Remove all examined items from the buffer in a single O(n) operation
  state.buffer.splice(0,idx);
  return rendered;
};

// ── Infinite scroll ────────────────────────────────────────────────────
const scrollObserver=new IntersectionObserver(entries=>{if(entries[0].isIntersecting) loadMoreBatch();},{rootMargin:'300px'});

const loadMoreBatch=async()=>{
  if(state.isLoadingMore||state.isSearching) return;
  if(allExhausted()) return;
  const sentinel=document.getElementById('loadSentinel');
  scrollObserver.unobserve(sentinel);
  state.isLoadingMore=true;
  const searchId=state.currentSearchId;
  const signal=state.abortController?.signal;
  const loadEl=document.getElementById('searchLoading');
  loadEl.textContent=state.totalDisplayed===0?'Searching deeper…':'Loading more…';
  loadEl.style.display='block';
  try{
    // Drain the buffer first; only fetch from the API when it is empty
    let objectResults=[],profileResults=[],rootResults=[];
    if(state.buffer.length===0){
      const fetched=await fetchNextPage(signal);
      if(state.currentSearchId!==searchId) return;
      objectResults=fetched.objectResults;profileResults=fetched.profileResults;rootResults=fetched.rootResults;
    }
    const added=await appendResultItems(objectResults,profileResults,rootResults,searchId,signal);
    if(state.currentSearchId!==searchId) return;
    state.totalDisplayed+=added;
    updateResultCount();
  }catch(e){if(e.name!=='AbortError') showSearchError('Failed to load more: '+e.message);}
  finally{
    loadEl.style.display='none';loadEl.textContent='Loading…';state.isLoadingMore=false;
    if(state.currentSearchId===searchId&&anyMoreNeeded()){
      if(state.totalDisplayed<DISPLAY_BATCH_SIZE&&(state.autoLoadDepth||0)<6){state.autoLoadDepth=(state.autoLoadDepth||0)+1;setTimeout(()=>loadMoreBatch(),0);}
      else{state.autoLoadDepth=0;scrollObserver.observe(sentinel);}
    }
  }
};

// ── URN media type detection ──────────────────────────────────────────
const getUrnFilePath=(urn)=>{
  if(!urn) return null;
  // Normalize backslashes to forward slashes
  const u=urn.replace(/\\/g,'/');
  if(/^IPFS:/i.test(u)||/^ipfs[:/]+/i.test(u)){
    // Return everything after the hash (the file path portion)
    const raw=u.replace(/^ipfs[:/]+/i,'');
    const slashIdx=raw.indexOf('/');
    return slashIdx>=0?raw.slice(slashIdx+1):null;
  }
  if(/^(BTC|LTC|DOG|MZC):/i.test(u)||/^[A-Za-z0-9]+\/.+/.test(u)){
    const parts=u.split(':').pop().split('/');
    return parts[1]||null;
  }
  return null;
};
const getUrnMediaUrl=(urn)=>{
  if(!urn) return null;
  const u=urn.replace(/\\/g,'/');
  if(/^IPFS:/i.test(u)||/^ipfs[:/]+/i.test(u)){
    // The CID itself is the content — the /filename is display metadata only.
    // Fetch via hash only: https://ipfs.io/ipfs/{HASH}
    const raw=u.replace(/^ipfs[:/]+/i,'');
    const hash=raw.split('/')[0];
    if(!hash) return null;
    return `https://ipfs.io/ipfs/${hash}`;
  }
  if(/^(BTC|LTC|DOG|MZC):/i.test(u)||/^[A-Za-z0-9]+\/.+/.test(u)){
    const parts=u.split(':').pop().split('/');
    if(!parts[0]||!/^[0-9a-fA-F]{64}$/.test(parts[0])) return null;
    const fileParts=parts.slice(1).map(p=>encodeURIComponent(p));
    return fileParts.length&&fileParts[0]?`${BASE_URL}/root/${parts[0]}/${fileParts.join('/')}`:null;
  }
  return null;
};
// Detect text-only URNs: bare 64-hex txid, or chain:txid with no file path
const isTextOnlyUrn=(urn)=>{
  if(!urn) return false;
  const u=urn.replace(/\\/g,'/').trim();
  // Bare 64-char hex (no chain prefix, no file path)
  if(/^[0-9a-fA-F]{64}$/.test(u)) return true;
  // Chain-prefixed bare txid: BTC:abc123..., TBTC:abc123..., LTC:abc123..., etc.
  if(/^(BTC|TBTC|LTC|DOG|MZC):[0-9a-fA-F]{64}$/i.test(u)) return true;
  return false;
};
const getUrnMediaType=(urn)=>{
  if(!urn) return null;
  if(isTextOnlyUrn(urn)) return 'text';
  // Check file extension from the actual file portion of the path
  const filePath=getUrnFilePath(urn)||getUrnMediaUrl(urn)||'';
  const lo=filePath.toLowerCase();
  if(/\.(mp4|webm|mov|ogg|ogv)$/.test(lo)) return 'video';
  if(/\.(mp3|wav|flac|aac|oga)$/.test(lo)) return 'audio';
  if(/\.pdf$/.test(lo)) return 'pdf';
  if(/\.html?$/.test(lo)) return 'html';
  if(/\.glb$/.test(lo)) return 'model';
  if(/\.gltf$/.test(lo)) return 'model';
  if(/\.(png|jpe?g|gif|webp|svg|avif|bmp)$/.test(lo)) return 'image';
  return null;
};

// ── Fetch text content for text-only URNs ───────────────────────────
const _textUrnCache=new Map();
const fetchTextForUrn=async(urn,mainnet)=>{
  const cacheKey=`text_${urn}_${mainnet}`;
  if(_textUrnCache.has(cacheKey)) return _textUrnCache.get(cacheKey);
  let text=null;
  try{
    const u=urn.replace(/\\/g,'/').trim();
    let txid,blockchain;
    const chainMatch=u.match(/^(BTC|TBTC|LTC|DOG|MZC):([0-9a-fA-F]{64})$/i);
    if(chainMatch){blockchain=chainMatch[1].toUpperCase();txid=chainMatch[2];}
    else{blockchain='BTC';txid=u;}
    const isBtcFamily=blockchain==='BTC'||blockchain==='TBTC';
    let data=getCachedTransaction(txid,mainnet,blockchain);
    if(!data){
      const url=isBtcFamily
        ?`${BASE_URL}/GetRootByTransactionID/${encodeURIComponent(txid)}?mainnet=${!!mainnet}`
        :`${BASE_URL}/GetRootByTransactionID/${encodeURIComponent(txid)}?blockchain=${blockchain}`;
      data=await fetchAPI(url,'',null,15000);
      if(data){const bd=data['Block Date']??data.BlockDate??'';if(bd&&!isNullDate(bd)) cacheTransaction(txid,mainnet,blockchain,data);}
    }
    if(data&&data.Message!=null){
      text=Array.isArray(data.Message)?data.Message.join('\n'):String(data.Message);
    }
  }catch{}
  if(text!=null) _textUrnCache.set(cacheKey,text);
  return text;
};

// ── Render text content as an SVG data-URL image ─────────────────────
const generateTextImage=(text,width,height)=>{
  const cacheKey=`textimg_${width}x${height}_${text}`;
  if(_textUrnCache.has(cacheKey)) return _textUrnCache.get(cacheKey);
  const pad=12,maxW=width-pad*2,maxH=height-pad*2;
  const approxCharWidth=8;
  const charsPerRow=Math.max(1,Math.floor(maxW/approxCharWidth));
  const estimatedRows=Math.max(1,Math.ceil(text.length/charsPerRow));
  const rowHeight=Math.max(9,Math.min(16,Math.floor(maxH/estimatedRows)));
  const fontSize=rowHeight;
  const charsPerLine=Math.max(1,Math.floor(maxW/(fontSize*0.6)));
  const maxLines=Math.floor(maxH/(fontSize*1.4));
  const truncateLine=(s)=>s.length>charsPerLine?s.slice(0,charsPerLine-1)+'…':s;
  const inputLines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const lines=[];let truncated=false;
  outer:for(const inputLine of inputLines){
    if(inputLine.trim()===''){if(lines.length<maxLines){lines.push('');}else{truncated=true;break;}continue;}
    const words=inputLine.split(/[ \t]+/);let line='';
    for(const word of words){
      const test=line?line+' '+word:word;
      if(test.length>charsPerLine&&line){if(lines.length>=maxLines){truncated=true;break outer;}lines.push(line);line=truncateLine(word);}
      else if(test.length>charsPerLine){if(lines.length>=maxLines){truncated=true;break outer;}lines.push(truncateLine(test));line='';truncated=true;}
      else{line=test;}
    }
    if(line){if(lines.length>=maxLines){truncated=true;break;}lines.push(line);}
  }
  if(truncated&&lines.length>0&&!lines[lines.length-1].endsWith('…')){
    const last=lines[lines.length-1];
    lines[lines.length-1]=last.length<charsPerLine?last+'…':last.slice(0,charsPerLine-1)+'…';
  }
  const lineHeight=fontSize*1.4;
  const totalTextH=lines.length*lineHeight;
  const startY=(height-totalTextH)/2+fontSize;
  const escape=(s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const textEls=lines.map((l,i)=>`<text x="${width/2}" y="${startY+i*lineHeight}" text-anchor="middle" dominant-baseline="auto" fill="#e0e0e0" font-size="${fontSize}" font-family="monospace,sans-serif">${escape(l)}</text>`).join('');
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='${width}' height='${height}'><rect width='100%' height='100%' fill='#333' rx='6'/>${textEls}</svg>`;
  const dataUrl=`data:image/svg+xml,${encodeURIComponent(svg)}`;
  _textUrnCache.set(cacheKey,dataUrl);
  return dataUrl;
};

// ── Build URN media preview element ─────────────────────────────────
const buildUrnPreviewEl=(urn,objectAddress,mainnet,blockchain,imgUrl)=>{
  const mtype=getUrnMediaType(urn);
  // If the URN has no special media type but there's an image, show the image in the preview
  const hasThumb=imgUrl&&imgUrl!==fallbackImage;
  if(!mtype&&!hasThumb) return null;

  const wrap=document.createElement('div');
  wrap.className='obj-preview';

  if(mtype==='text'){
    // Text-only URN: fetch message text from GetRootByTransactionID
    const textWrap=document.createElement('div');
    textWrap.className='obj-preview-text';
    textWrap.style.cssText='padding:16px;color:#ccc;font-size:0.9em;line-height:1.5;white-space:pre-wrap;word-break:break-word;min-height:60px;';
    textWrap.textContent='Loading text…';
    wrap.appendChild(textWrap);
    fetchTextForUrn(urn,mainnet).then(t=>{
      if(t){textWrap.textContent=t;}else{textWrap.style.color='#666';textWrap.textContent='(No text content found)';}
    }).catch(()=>{textWrap.style.color='#666';textWrap.textContent='(Failed to load text)';});
    return wrap;
  }

  if(!mtype&&hasThumb){
    // Only an image, no URN media — render as full-size preview
    const imgEl=document.createElement('img');imgEl.className='preview-img';imgEl.alt='Preview';imgEl.src=fallbackImage;
    loadImageWithTimeout(imgUrl).then(u=>{imgEl.src=u;}).catch(()=>{});
    wrap.appendChild(imgEl);
    return wrap;
  }

  const mediaUrl=getUrnMediaUrl(urn);
  if(!mediaUrl) return null;

  if(mtype==='image'){
    const imgEl=document.createElement('img');imgEl.className='preview-img';imgEl.alt='Preview';imgEl.src=fallbackImage;
    loadImageWithTimeout(mediaUrl).then(u=>{imgEl.src=u;}).catch(()=>{imgEl.src=mediaUrl;});
    wrap.appendChild(imgEl);
  }else if(mtype==='video'){
    const v=document.createElement('video');
    v.controls=true;v.preload='auto';v.crossOrigin='anonymous';
    v.src=mediaUrl;
    wrap.appendChild(v);
  }else if(mtype==='audio'){
    const aWrap=document.createElement('div');
    if(hasThumb){
      aWrap.className='preview-audio-wrap';
      const bgImg=document.createElement('img');bgImg.className='preview-audio-bg';bgImg.alt='';bgImg.src=fallbackImage;
      loadImageWithTimeout(imgUrl).then(u=>{bgImg.src=u;}).catch(()=>{});
      aWrap.appendChild(bgImg);
    }else{
      aWrap.className='preview-audio-wrap no-thumb';
    }
    const a=document.createElement('audio');
    a.controls=true;a.preload='metadata';a.src=mediaUrl;
    aWrap.appendChild(a);
    wrap.appendChild(aWrap);
  }else if(mtype==='pdf'){
    const ifr=document.createElement('iframe');
    ifr.className='preview-pdf';ifr.src=mediaUrl;ifr.title='PDF Preview';
    wrap.appendChild(ifr);
  }else if(mtype==='html'){
    const chain=(blockchain||'BTC').toUpperCase();
    const chainParam=chain==='TBTC'?'BTC':chain;
    const qs=new URLSearchParams({
      address:objectAddress||'',
      mainnet:String(!!mainnet),
      network:chainParam,
      blockchain:chainParam,
      urn:urn||'',
    });
    const ifr=document.createElement('iframe');
    ifr.src=`${mediaUrl}?${qs.toString()}`;
    ifr.title='Object Preview';ifr.sandbox='allow-scripts allow-same-origin allow-forms allow-popups';
    ifr.style.cssText='width:100%;height:420px;border:none;display:block;background:#fff;';
    wrap.appendChild(ifr);
  }else if(mtype==='model'){
    const mv=document.createElement('model-viewer');
    console.log('[GLB] Attempting to load model-viewer src:', mediaUrl, '| urn:', urn);
    mv.setAttribute('src',mediaUrl);
    mv.setAttribute('camera-controls','');
    mv.setAttribute('auto-rotate','');
    mv.setAttribute('shadow-intensity','1');
    mv.setAttribute('exposure','1');
    mv.setAttribute('ar','');
    mv.setAttribute('ar-modes','webxr scene-viewer quick-look');
    mv.setAttribute('crossorigin','anonymous');
    mv.setAttribute('loading','eager');
    mv.style.cssText='width:100%;height:100%;display:block;background:#111;';
    // Wrapper provides positioning context for the centered overlay
    const mvWrap=document.createElement('div');
    mvWrap.style.cssText='position:relative;width:100%;aspect-ratio:1/1;';
    const mvLoader=document.createElement('div');
    mvLoader.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#03dac6;padding:7px 18px;border-radius:6px;font-size:0.85em;pointer-events:none;z-index:2;';
    mvLoader.textContent='Loading 3D…';
    const mvTimeout=setTimeout(()=>{
      if(mvLoader.style.display!=='none'){
        console.warn('[GLB] model-viewer load timed out (120s) for src:', mediaUrl);
        mvLoader.style.color='#ff5252';mvLoader.textContent='⚠ Model load timed out';
      }
    },120000);
    mv.addEventListener('load',()=>{console.log('[GLB] model-viewer loaded successfully:', mediaUrl);clearTimeout(mvTimeout);mvLoader.style.display='none';});
    mv.addEventListener('error',(e)=>{console.error('[GLB] model-viewer error for src:', mediaUrl, e);clearTimeout(mvTimeout);mvLoader.style.color='#ff5252';mvLoader.textContent='⚠ Failed to load 3D model';});
    mvWrap.appendChild(mv);
    mvWrap.appendChild(mvLoader);
    wrap.appendChild(mvWrap);
  }
  return wrap;
};

// ── URN/object link renderer ───────────────────────────────────────────
const renderUrnLinkForObj=(urn)=>{
  if(!urn) return 'None';
  if(/^IPFS:/i.test(urn)||/^ipfs[:/]+/i.test(urn)){
    // Link to just the CID (hash); filename portion is display-only
    const hash=urn.replace(/^ipfs[:/]+/i,'').split(/[/\\]/)[0];
    return `<a href="https://ipfs.io/ipfs/${encodeURIComponent(hash)}" target="_blank" rel="noopener">${escapeHtml(urn)}</a>`;
  }
  if(/^(BTC|LTC|DOG|MZC):/i.test(urn)||/^[A-Za-z0-9]+\/.+/.test(urn)){
    const parts=urn.split(':').pop().split('/');
    const txid=parts[0];const filePath=parts[1]||'';
    const href=filePath?`${BASE_URL}/root/${txid}/${filePath}`:`${BASE_URL}/root/${txid}/MSG1`;
    return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${escapeHtml(urn)}</a>`;
  }
  return escapeHtml(urn);
};

const updateMetaTags=(title,description,image,url)=>{

  const fullTitle=title?`${title} — bitFossil`:document.title;
  if(title) document.title=fullTitle;
  set('og-title',fullTitle); set('og-description',description); set('og-image',image); set('og-url',url||window.location.href);
  set('tw-title',fullTitle); set('tw-description',description); set('tw-image',image);
