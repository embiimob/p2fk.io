// ── Sort helper (objects) ─────────────────────────────────────────────
const sortObjects=(objects,sortBy)=>{
  const comparePrice=(a,b,dir)=>{
    const la=a.Listings?Math.min(...Object.values(a.Listings).map(l=>l.Value||Infinity)):Infinity;
    const lb=b.Listings?Math.min(...Object.values(b.Listings).map(l=>l.Value||Infinity)):Infinity;
    return dir==='asc'?la-lb:lb-la;
  };
  return [...objects].sort((a,b)=>{
    if(sortBy==='newest') return new Date(b.CreatedDate)-new Date(a.CreatedDate);
    if(sortBy==='oldest') return new Date(a.CreatedDate)-new Date(b.CreatedDate);
    if(sortBy==='highestPrice') return comparePrice(a,b,'desc');
    if(sortBy==='lowestPrice') return comparePrice(a,b,'asc');
    if(sortBy==='highestActivity') return (b.ProcessHeight||0)-(a.ProcessHeight||0);
    if(sortBy==='recentActivity') return new Date(b.ChangeDate)-new Date(a.ChangeDate);
    return 0;
  });
};

const getUrnChainBadge=(urn)=>{
  if(!urn) return null;
  const u=(urn||'').replace(/\\/g,'/');
  if(/^IPFS:/i.test(u)) return 'IPFS';
  const m=u.match(/^([A-Za-z]+):/);
  if(m) return m[1].toUpperCase();
  return null;
};

const renderObjMiniCard=(obj,mainnet,ownerAddress)=>{
  const card=document.createElement('div');card.className='profile-obj-card';
  let imgUrl=getImageUrl(obj.Image,obj.URN);
  if(imgUrl===fallbackImage&&getUrnMediaType(obj.URN)==='image') imgUrl=getUrnMediaUrl(obj.URN)||fallbackImage;
  const imgWrap=document.createElement('div');imgWrap.className='poc-img-wrap';
  const img=document.createElement('img');img.src=fallbackImage;img.alt=obj.Name||'Object';
  // Text-only URNs: render content as an SVG image in the thumbnail
  if(isTextOnlyUrn(obj.URN)){
    fetchTextForUrn(obj.URN,mainnet).then(t=>{if(t) img.src=generateTextImage(t,250,110);}).catch(()=>{});
  }else{
    loadImageWithTimeout(imgUrl).then(u=>{img.src=u;}).catch(()=>{});
  }
  imgWrap.appendChild(img);
  // Blockchain badge top-left
  const chainBadge=getUrnChainBadge(obj.URN)||(mainnet?'BTC':'TBTC');
  const chainBadgeEl=document.createElement('span');chainBadgeEl.className='poc-chain-badge';chainBadgeEl.textContent=chainBadge;
  imgWrap.appendChild(chainBadgeEl);

  // Creators: index 0 = object address (navigation only), index 1 = collection, index 2 = additional creator
  const creatorKeys=Object.keys(obj.Creators||{});
  const objectAddress=creatorKeys[0]||'';
  const collectionAddr=creatorKeys[1]||'';
  const additionalAddr=creatorKeys[2]||'';
  const isCollUnack=!!(collectionAddr&&obj.Creators[collectionAddr]==='0001-01-01T00:00:00');
  const isAddlUnack=!!(additionalAddr&&obj.Creators[additionalAddr]==='0001-01-01T00:00:00');

  const totalUnits=obj.Owners?Object.values(obj.Owners).reduce((s,v)=>s+(v?.Item1??v??0),0):0;
  const lowestPrice=obj.Listings&&Object.keys(obj.Listings).length?Math.min(...Object.values(obj.Listings).map(l=>l.Value)):null;

  // Owned qty badge: bottom-right of image when ownerAddress is provided
  const ownedQty=(ownerAddress&&obj.Owners)?(obj.Owners[ownerAddress]?.Item1??null):null;
  if(ownedQty!==null&&ownedQty>0){
    const ownedBadge=document.createElement('span');
    ownedBadge.className='poc-owned-badge';
    ownedBadge.textContent=`×${ownedQty}`;
    imgWrap.appendChild(ownedBadge);
  }
  card.appendChild(imgWrap);

  const body=document.createElement('div');body.className='poc-body';
  body.innerHTML=`<div class="poc-name">${escapeHtml(obj.Name||'Unnamed')}</div>${collectionAddr?`<div class="poc-creator${isCollUnack?' poc-unack':''}" data-addr="${escapeHtml(collectionAddr)}">…</div>`:''}${additionalAddr?`<div class="poc-creator${isAddlUnack?' poc-unack':''}" data-addr="${escapeHtml(additionalAddr)}">…</div>`:''}${totalUnits?`<div class="poc-units">${totalUnits} unit${totalUnits===1?'':'s'}</div>`:''}${obj.CreatedDate&&!isNullDate(obj.CreatedDate)?`<div class="poc-date">${formatDate(obj.CreatedDate)||''}</div>`:''}${lowestPrice!==null?`<div class="poc-price-badge">${lowestPrice} BTC</div>`:''}`;
  card.appendChild(body);
  card.addEventListener('click',()=>{if(objectAddress) navigateTo('object',{object:objectAddress,mainnet});});

  // Async resolve each creator row
  const _resolveCreator=(addr,isUnack,el)=>{
    fetchProfileByAddress(addr,mainnet,null).then(p=>{
      const name=p?(p.DisplayName||p.URN||abbreviateAddress(addr)):abbreviateAddress(addr);
      el.textContent=name;
      el.title=(isUnack?'Unacknowledged: ':'')+name;
      const navTarget=p?(p.URN||addr):addr;
      el.addEventListener('click',e=>{e.stopPropagation();navigateTo('profile',{profile:navTarget,mainnet});});
    }).catch(()=>{
      el.textContent=abbreviateAddress(addr);
      el.addEventListener('click',e=>{e.stopPropagation();navigateTo('profile',{profile:addr,mainnet});});
    });
  };
  body.querySelectorAll('.poc-creator').forEach(el=>{
    const addr=el.dataset.addr;
    if(addr) _resolveCreator(addr,el.classList.contains('poc-unack'),el);
    else el.remove();
  });
  return card;
};

const _tabIdForType={owned:'tabOwned',created:'tabCreated',associated:'tabAssoc'};
const PROFILE_OBJ_PAGE=20;
const loadProfileObjects=async(type,address,mainnet)=>{
  const gridEl=document.getElementById('profileObjGrid');
  const statusEl=document.getElementById('profileObjStatus');
  const sortEl=document.getElementById('profileObjSort');
  if(!gridEl||!address) return;
  gridEl.innerHTML='';
  gridEl.style.display='none';
  // Remove any leftover load-more button from a previous batch
  const prevBtn=gridEl.parentNode?gridEl.parentNode.querySelector('.poc-load-more'):null;
  if(prevBtn) prevBtn.remove();
  if(statusEl){statusEl.className='profile-obj-loading';statusEl.textContent='Loading…';statusEl.style.display='block';}
  const sortBy=sortEl?sortEl.value:'newest';
  const endpoints={owned:'GetObjectsOwnedByAddress',created:'GetObjectsCreatedByAddress',associated:'GetObjectsByAddress'};
  const ep=endpoints[type]||'GetObjectsByAddress';
  const tabLabels={owned:'Owned',created:'Created',associated:'Associated'};
  try{
    const data=await fetchAPI(`${BASE_URL}/${ep}/${encodeURIComponent(address)}?mainnet=${mainnet}&skip=0&qty=-1&verbose=false`,'',null,30000);
    let objs=Array.isArray(data)?data:[];
    // Objects API may return them wrapped or bare
    objs=objs.map(o=>o.Object||o.object||o).filter(o=>o&&typeof o==='object'&&!Array.isArray(o));
    // Update tab button with count
    const tabBtn=document.getElementById(_tabIdForType[type]);
    if(tabBtn) tabBtn.textContent=`${tabLabels[type]||type} (${objs.length})`;
    objs=sortObjects(objs,sortBy);
    gridEl.innerHTML='';
    if(!objs.length){
      if(statusEl){statusEl.className='profile-obj-empty';statusEl.textContent=`No ${type} objects found.`;statusEl.style.display='block';}
    }else{
      if(statusEl) statusEl.style.display='none';
      let rendered=0;
      const renderBatch=()=>{
        const end=Math.min(rendered+PROFILE_OBJ_PAGE,objs.length);
        for(let i=rendered;i<end;i++){
          const c=renderObjMiniCard(objs[i],mainnet,type==='owned'?address:undefined);
          gridEl.appendChild(c);
        }
        rendered=end;
        // Remove any old load-more button before potentially adding a new one
        const old=gridEl.parentNode.querySelector('.poc-load-more');
        if(old) old.remove();
        if(rendered<objs.length){
          const btn=document.createElement('button');
          btn.className='obj-load-more-btn poc-load-more';
          btn.textContent=`Load more (${objs.length-rendered} remaining)`;
          btn.onclick=()=>renderBatch();
          gridEl.parentNode.insertBefore(btn,gridEl.nextSibling);
        }
      };
      renderBatch();
      gridEl.style.display='grid';
    }
  }catch(e){
    const tabBtn=document.getElementById(_tabIdForType[type]);
    if(tabBtn) tabBtn.textContent=tabLabels[type]||type;
    if(statusEl){statusEl.className='profile-obj-empty';statusEl.textContent='Failed to load objects: '+e.message;statusEl.style.display='block';}
  }
};

// ── Profile view ───────────────────────────────────────────────────────
const showProfileView=async(identifier,mainnet=true)=>{
  setView('profile');
  const loadEl=document.getElementById('profileLoading');
  const errEl=document.getElementById('profileError');
  const panelEl=document.getElementById('profilePanel');
  const innerEl=document.getElementById('profilePanelInner');
  const feedEl=document.getElementById('profileMsgFeed');
  loadEl.style.display='block';errEl.textContent='';errEl.style.display='none';panelEl.style.display='none';
  innerEl.innerHTML='';feedEl.innerHTML='';
  // Disconnect any previous message scroll observer
  if(state.profileMsgObserver){state.profileMsgObserver.disconnect();state.profileMsgObserver=null;}

  try{
    let profile=null;
    let address='';
    if(isAddress(identifier)){
      address=identifier;
      profile=await fetchProfileByAddress(identifier,mainnet,null);
      if(!profile) profile={DisplayName:abbreviateAddress(identifier),URN:'',Address:identifier};
    }else{
      // Try requested network first, then the other
      profile=await fetchProfileByURN(identifier,mainnet,null);
      if(!profile){
        profile=await fetchProfileByURN(identifier,!mainnet,null);
        if(profile) mainnet=!mainnet; // switch network to match found profile
      }
      if(!profile) throw new Error(`Profile not found: ${identifier}`);
      // Creators can be an array (from GetProfileByURN) or an object/dict (from other endpoints).
      // Array form: ["addr1", ...] → first element is the owner address.
      // Object form: {"addr1": date, ...} → first key is the owner address.
      const _creators=profile.Creators;
      let _creatorAddr='';
      if(Array.isArray(_creators)){
        _creatorAddr=(_creators.find(a=>typeof a==='string'&&a.length>10))||'';
      }else if(_creators&&typeof _creators==='object'){
        _creatorAddr=Object.keys(_creators).find(k=>k!=='0'&&k.length>10)||'';
      }
      address=profile.Address||profile['Signed By']||_creatorAddr||'';
    }

    const imgUrl=getImageUrl(profile.Image,profile.URN);
    const txm=imgUrl.match(/\/root\/([0-9a-fA-F]{64})\//i)?.[1];
    if(txm) state.txidMeta.set(txm,chainToMeta(mainnet?'BTC':'TBTC'));

    // Update meta tags for sharing
    const displayName=profile.DisplayName||profile.URN||'Unknown Profile';
    updateMetaTags(displayName,profile.Bio||`On-chain profile on bitFossil`,imgUrl!==fallbackImage?imgUrl:'https://p2fk.io/bitfossil.png');

    // Build profile panel
    innerEl.innerHTML='';
    const shareBtn=makeShareBtn('profile',{id:profile.URN||identifier,mainnet});
    innerEl.appendChild(shareBtn);

    const imgEl=document.createElement('img');imgEl.className='profile-panel-img';imgEl.src=fallbackImage;imgEl.alt=displayName;
    loadImageWithTimeout(imgUrl).then(u=>{imgEl.src=u;}).catch(()=>{});
    innerEl.appendChild(imgEl);

    const info=document.createElement('div');info.className='profile-panel-info';

    // Location: profile.Location is an object {quark:...} or a string
    const locRaw=profile.Location;
    let locText='';
    if(locRaw){
      if(typeof locRaw==='object') locText=locRaw.quark||locRaw.Quark||'';
      else locText=String(locRaw);
    }
    const locHtml=locText?`<p>📍 ${escapeHtml(locText)}</p>`:'';

    // Bio
    const bioHtml=profile.Bio?`<p>${escapeHtml(profile.Bio)}</p>`:'';

    // URL links — profile.URL is an object {label: value} where @xxx = internal profile link
    let urlHtml='';
    if(profile.URL&&typeof profile.URL==='object'){
      const urlEntries=Object.entries(profile.URL);
      if(urlEntries.length){
        const linksHtml=urlEntries.map(([k,v])=>{
          const vs=String(v||'');
          if(vs.startsWith('@')){
            const urn=vs.slice(1);
            return `<span class="profile-url-link internal" data-urn="${escapeHtml(urn)}" title="View profile: ${escapeHtml(urn)}">@${escapeHtml(urn)}</span>`;
          }
          return `<a class="profile-url-link" href="${escapeHtml(vs)}" target="_blank" rel="noopener">${escapeHtml(k)}</a>`;
        }).join('');
        urlHtml=`<p>🔗 ${linksHtml}</p>`;
      }
    }

    // Created date
    const dateHtml=profile.CreatedDate&&!isNullDate(profile.CreatedDate)?`<p>Joined: ${formatDate(profile.CreatedDate)||escapeHtml(profile.CreatedDate)}</p>`:'';

    // Changed date
    const changedHtml=profile.ChangeDate&&!isNullDate(profile.ChangeDate)?`<p>Modified: ${formatDate(profile.ChangeDate)||escapeHtml(profile.ChangeDate)}</p>`:'';

    // Process height placeholder
    const heightHtml=address?`<p class="profile-height" id="processHeightEl">Process height: <span id="processHeightVal">…</span></p>`:'';

    info.innerHTML=`<h2>${escapeHtml(displayName)}${address?` <span class="profile-handle-addr" id="profAddrInline" title="${escapeHtml(address)}">${escapeHtml(abbreviateAddress(address))}</span>`:''}</h2>${bioHtml}${locHtml}${urlHtml}${dateHtml}${changedHtml}${heightHtml}`;
    innerEl.appendChild(info);

    panelEl.style.display='block';
    loadEl.style.display='none';

    // Async URN legitimacy check: verify Creators address from GetProfileByURN matches this address

      _isOfficialProfile(profile.URN,address,mainnet).then(official=>{
        if(!official){
          const banner=document.createElement('div');
          banner.style.cssText='background:#cf0000;color:#fff;font-size:1em;font-weight:bold;text-align:center;padding:7px 12px;border-radius:5px;letter-spacing:0.06em;margin-top:8px;';
          banner.textContent='[ NOT OFFICIAL ]';
          // Insert at the top of the info block so it's immediately visible

        }
      });

    // Wire up address copy (abbreviated address in header)
    const addrInlineEl=document.getElementById('profAddrInline');
    if(addrInlineEl) addrInlineEl.addEventListener('click',async(e)=>{
      e.stopPropagation();
      try{await navigator.clipboard.writeText(address);}catch{}
      const prev=addrInlineEl.textContent;addrInlineEl.textContent='✅';setTimeout(()=>{addrInlineEl.textContent=prev;},1500);
    });

    // Wire up internal profile URL links (@xxx → navigate by URN)
    info.querySelectorAll('.profile-url-link.internal').forEach(el=>{
      el.addEventListener('click',()=>{
        const urnRaw=el.dataset.urn||'';
        // Strip any leading @ — showProfileView handles URN resolution
        const urnTarget=urnRaw.startsWith('@')?urnRaw.slice(1):urnRaw;
        navigateTo('profile',{profile:urnTarget,mainnet:false});
      });
    });

    // Load process height asynchronously
    if(address){
      (async()=>{
        try{
          const roots=await fetchAPI(`${BASE_URL}/GetRootsByAddress/${encodeURIComponent(address)}?mainnet=${mainnet}&verbose=false`,'',null,30000);
          const count=Array.isArray(roots)?roots.length:0;
          const hEl=document.getElementById('processHeightVal');
          if(hEl) hEl.textContent=count;
        }catch{}
      })();
    }

    // ── Profile tab wiring ────────────────────────────────────────────
    let _activeProfileTab='messages';
    const _switchProfileTab=async(tab)=>{
      _activeProfileTab=tab;
      document.querySelectorAll('.profile-obj-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
      const sortWrap=document.getElementById('profileSortWrap');
      const feedEl2=document.getElementById('profileMsgFeed');
      const moreBtn2=document.getElementById('profileMsgLoadMore');
      const gridEl=document.getElementById('profileObjGrid');
      const statusEl=document.getElementById('profileObjStatus');
      if(tab==='messages'){
        if(sortWrap) sortWrap.style.display='none';
        if(feedEl2) feedEl2.style.display='';
        if(moreBtn2) moreBtn2.style.display='';
        if(gridEl) gridEl.style.display='none';
        if(statusEl) statusEl.style.display='none';
      }else{
        if(sortWrap) sortWrap.style.display='flex';
        if(feedEl2) feedEl2.style.display='none';
        if(moreBtn2) moreBtn2.style.display='none';
        if(statusEl) statusEl.style.display='block';
        await loadProfileObjects(tab,address,mainnet);
      }
    };
    document.querySelectorAll('.profile-obj-tab').forEach(btn=>{
      btn.onclick=()=>_switchProfileTab(btn.dataset.tab);
    });
    const sortSel=document.getElementById('profileObjSort');
    if(sortSel) sortSel.onchange=()=>{if(_activeProfileTab!=='messages') loadProfileObjects(_activeProfileTab,address,mainnet);};

    // Load messages
    state.profileMsgSkip=0;
    state.profileMsgAddress=address;
    state.profileMsgMainnet=mainnet;
    state.profileMsgExhausted=false;
    state.profileMsgLoading=false;

    // Set up infinite scroll for profile messages feed
    if(state.profileMsgObserver){state.profileMsgObserver.disconnect();state.profileMsgObserver=null;}
    const sentinelEl=document.getElementById('profileMsgSentinel');
    if(sentinelEl&&address){
      state.profileMsgObserver=new IntersectionObserver(entries=>{
        if(entries[0].isIntersecting&&!state.profileMsgExhausted&&!state.profileMsgLoading) loadProfileMessages();
      },{rootMargin:'200px'});
      state.profileMsgObserver.observe(sentinelEl);
    }

    if(address){
      await loadProfileMessages();
    }else{
      const msgsBtn2=document.getElementById('tabMessages');if(msgsBtn2) msgsBtn2.textContent='Messages (0)';
    }
  }catch(e){
    loadEl.style.display='none';
    errEl.textContent='Failed to load profile: '+e.message;
    errEl.style.display='block';
  }
};

const loadProfileMessages=async()=>{
  if(state.profileMsgExhausted||state.profileMsgLoading) return;
  state.profileMsgLoading=true;
  const feedEl=document.getElementById('profileMsgFeed');

  try{
    const data=await fetchAPI(`${BASE_URL}/GetPublicMessagesByAddress/${encodeURIComponent(state.profileMsgAddress)}?mainnet=${state.profileMsgMainnet}&skip=${state.profileMsgSkip}&qty=${MSG_PAGE_SIZE}`,'',null);
    const roots=Array.isArray(data)?data:[];
    const bc=state.profileMsgMainnet?'BTC':'BTC-TESTNET';
    for(const item of roots){
      const root=item.Root||item.root||item;
      const n=normalizeRoot(root);
      if(!n) continue;
      const card=await renderMessageCard(n,null,bc,{id:n.txId,mainnet:state.profileMsgMainnet,blockchain:state.profileMsgMainnet?'BTC':'BTC'});
      feedEl.appendChild(card);
    }
    state.profileMsgSkip+=roots.length;
    if(roots.length<MSG_PAGE_SIZE) state.profileMsgExhausted=true;
    const msgsTabBtn=document.getElementById('tabMessages');if(msgsTabBtn) msgsTabBtn.textContent=`Messages (${state.profileMsgSkip})`;
  }catch(e){
    document.getElementById('profileError').textContent='Failed to load messages: '+e.message;
    document.getElementById('profileError').style.display='block';
  }finally{
    state.profileMsgLoading=false;
  }
};

// ── Object view ────────────────────────────────────────────────────────
const formatDateShort=(d)=>{if(!d||isNullDate(d)) return null;try{const x=new Date(d);return isNaN(x)?null:x.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});}catch{return null;}};
const formatDateFull=(d)=>{if(!d||isNullDate(d)) return null;try{const x=new Date(d);return isNaN(x)?null:x.toLocaleString();}catch{return null;}};

const buildObjSection=(title,rows,colDefs)=>{
  if(!rows||!rows.length) return '';
  const headerCols=colDefs.map(c=>`<span class="${c.cls||'col-name'}">${escapeHtml(c.label)}</span>`).join('');
  const bodyRows=rows.map(r=>`<div class="obj-list-row${r._cls?' '+r._cls:''}">${colDefs.map(c=>`<span class="${c.cls||'col-name'}">${r[c.key]||''}</span>`).join('')}</div>`).join('');
  return `<div class="obj-section"><p class="obj-section-title">${escapeHtml(title)}</p><div class="obj-list"><div class="obj-list-header">${headerCols}</div>${bodyRows}</div></div>`;
};

const OBJ_LIST_PAGE=20;
// Inject rows HTML into a list container; cap at OBJ_LIST_PAGE with a "Show more" button.
// wireClicks(tmpContainer) is called on the batch's temp div before nodes are moved to listEl.
const populateObjList=(listElId,rows,wireClicks)=>{
  const listEl=document.getElementById(listElId);
  if(!listEl) return;
  let shown=0;
  const renderNextBatch=()=>{
    const end=Math.min(shown+OBJ_LIST_PAGE,rows.length);
    const tmp=document.createElement('div');
    tmp.innerHTML=rows.slice(shown,end).join('');
    if(wireClicks) wireClicks(tmp);
    const old=listEl.querySelector('.obj-list-show-more');
    if(old) old.remove();
    while(tmp.firstChild) listEl.appendChild(tmp.firstChild);
    shown=end;
    if(shown<rows.length){
      const btn=document.createElement('button');
      btn.className='obj-load-more-btn obj-list-show-more';
      btn.textContent=`Show more (${rows.length-shown} remaining)`;
      btn.onclick=()=>renderNextBatch();
      listEl.appendChild(btn);
    }
  };
  renderNextBatch();
};

    refreshBtn.addEventListener('click',async()=>{

      try{
        const fresh=await fetchAPI(`${BASE_URL}/GetObjectByAddress/${encodeURIComponent(objectAddress)}?mainnet=${mainnet}&verbose=true`,'Refresh failed',null);
        const newObj=fresh?.Object||fresh?.object||fresh;
        if(!newObj||Array.isArray(newObj)) throw new Error('No object data in refresh response');
        cacheObject(objectAddress,mainnet,newObj);
        await doRender(newObj);
      }catch(e){

    });

  try{

    if(isAddress(identifier)){

      if(cached){obj=cached;}else{
        const data=await fetchAPI(`${BASE_URL}/GetObjectByAddress/${encodeURIComponent(identifier)}?mainnet=${mainnet}&verbose=false`,'',null);
        obj=data?.Object||data?.object||data;
        if(obj&&!Array.isArray(obj)) cacheObject(identifier,mainnet,obj);
      }
    }else{
      const cached=getCachedObject(identifier,mainnet);
      if(cached){obj=cached;}else{
        const data=await fetchAPI(`${BASE_URL}/GetObjectByURN/${encodeURIComponent(identifier)}?mainnet=${mainnet}&verbose=false`,'',null);
        obj=data?.Object||data?.object||data;
        if(obj&&!Array.isArray(obj)) cacheObject(identifier,mainnet,obj);
      }
    }
    if(!obj||Array.isArray(obj)) throw new Error(`Object not found: ${identifier}`);
    await doRender(obj);
  }catch(e){
    loadEl.style.display='none';
    errEl.textContent='Failed to load object: '+e.message;
    errEl.style.display='block';
  }
};

// ── Single message view ────────────────────────────────────────────────
const showMessageView=async(txid,mainnet=true,blockchain='BTC')=>{
  setView('message');
  const loadEl=document.getElementById('msgLoading');
  const errEl=document.getElementById('msgError');
  const detailEl=document.getElementById('msgDetail');
  loadEl.style.display='block';errEl.textContent='';errEl.style.display='none';detailEl.style.display='none';detailEl.innerHTML='';

  try{
    const chain=(blockchain||'BTC').toUpperCase();
    let raw=getCachedTransaction(txid,mainnet,chain);
    if(!raw){
      const url=chain!=='BTC'
        ?`${BASE_URL}/GetRootByTransactionID/${encodeURIComponent(txid)}?blockchain=${encodeURIComponent(chain)}&verbose=false`
        :`${BASE_URL}/GetRootByTransactionID/${encodeURIComponent(txid)}?mainnet=${mainnet}&verbose=false`;
      const data=await fetchAPI(url,'',null);
      raw=Array.isArray(data)?data[0]:data;
      if(raw){const bd=raw['Block Date']??raw.BlockDate??'';if(bd&&!isNullDate(bd)) cacheTransaction(txid,mainnet,chain,raw);}
    }
    if(!raw) throw new Error(`Message not found for txid: ${txid}`);

    const normalized=normalizeRoot(raw);
    if(!normalized) throw new Error('Could not parse message data');

    const bc=chain==='BTC'?(mainnet?'BTC':'BTC-TESTNET'):chain;
    const card=await renderMessageCard(normalized,null,bc,{id:txid,mainnet,blockchain:CHAIN_UPPER_TO_API[chain]||'BTC'});
    // Update meta tags for sharing the message
    const msgPreview=(normalized.message||'').replace(/\s+/g,' ').trim().substring(0,160);
    updateMetaTags(`Message on bitFossil`,msgPreview||'On-chain message on bitFossil','https://p2fk.io/bitfossil.png');
    detailEl.appendChild(card);
    detailEl.style.display='block';
    loadEl.style.display='none';
  }catch(e){
    loadEl.style.display='none';
    errEl.textContent='Failed to load message: '+e.message;
    errEl.style.display='block';
  }
};

// ── View switching ─────────────────────────────────────────────────────
const setView=(name)=>{
  state.currentView=name;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=document.getElementById(`view-${name}`);
  if(el) el.classList.add('active');
  // Only show filter bar for search view
  document.getElementById('filter-bar').style.display=(name==='search')?'':'none';
  // Adjust top padding accordingly
  document.getElementById('main').style.paddingTop=(name==='search')?'98px':'62px';
  // Reset meta tags for search / home view
  if(name==='search'){
    updateMetaTags('bitFossil — On-Chain Social','Discover on-chain messages, profiles, and digital objects on the Bitcoin blockchain.','https://p2fk.io/bitfossil.png','https://p2fk.io/');
    document.title='bitFossil — On-Chain Social';
  }
};

// ── SPA navigation ─────────────────────────────────────────────────────
const navigateTo=(view,params={})=>{
  const url=new URL(window.location.href);
  // Clear previous view params
  ['search','profile','object','message','mainnet','blockchain'].forEach(k=>url.searchParams.delete(k));
  Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='') url.searchParams.set(k,String(v));});
  history.pushState({view,params},'',(url.searchParams.toString()?'?'+url.searchParams.toString():'/'));
  loadFromParams(url.searchParams);
};

const loadFromParams=(sp)=>{
  const profile=sp.get('profile');
  const object=sp.get('object');
  const message=sp.get('message');
  const search=sp.get('search');
  const mainnet=sp.get('mainnet')!=='false'; // default true
  const blockchain=(sp.get('blockchain')||'BTC').toUpperCase();

  if(message){
    showMessageView(message,mainnet,blockchain);
  }else if(profile){
    showProfileView(profile,mainnet);
  }else if(object){
    showObjectView(object,mainnet);
  }else{
    setView('search');
    if(search){
      document.getElementById('navbar-search-input').value=search;
      performSearch(search);
    }else{
      performSearch('*');
    }
  }
};

// ── Back buttons ───────────────────────────────────────────────────────
const goBack=()=>{
  if(history.length>1) history.back();
  else navigateTo('search',{});
};
document.getElementById('backFromProfile').addEventListener('click',goBack);
document.getElementById('backFromObject').addEventListener('click',goBack);
document.getElementById('backFromMessage').addEventListener('click',goBack);

window.addEventListener('popstate',(e)=>{
  const sp=new URLSearchParams(window.location.search);
  loadFromParams(sp);
});

// ── Navbar search ──────────────────────────────────────────────────────
// ── Smart search: @username → profile, #keyword → object search ─────
const handleNavSearch=async()=>{
  // User action always cancels any in-progress auto-triggered search
  if(state.isSearching){
    if(state.abortController) state.abortController.abort();
    state.isSearching=false;
  }
  const raw=document.getElementById('navbar-search-input').value.trim();
  if(!raw){navigateTo('search',{});return;}
  if(raw.startsWith('@')){
    const urnTarget=raw.slice(1).trim();
    if(!urnTarget) return;
    const btcChk=document.getElementById('chkBitcoin').checked;
    const tbtcChk=document.getElementById('chkTestnet3').checked;
    if(btcChk&&tbtcChk){
      showSearchError('@profile search requires selecting only BTC or TBTC, not both.');
      setView('search');
      return;
    }
    // Use selected network; if neither is checked default to TBTC (common dev default)
    const isMainnet=btcChk&&!tbtcChk;
    navigateTo('profile',{profile:urnTarget,mainnet:isMainnet});
    return;
  }
  if(raw.startsWith('#')){
    // Keyword object search
    const kw=raw.slice(1).trim();
    if(!kw) return;
    navigateTo('search',{search:raw}); // performSearch will detect #
    return;
  }
  navigateTo('search',{search:raw});
};

document.getElementById('search-form').addEventListener('submit',(e)=>{
  e.preventDefault();
  handleNavSearch();
});

document.getElementById('navbar-search-btn').addEventListener('click',(e)=>{
  e.preventDefault();
  handleNavSearch();
});

document.getElementById('brandHome').addEventListener('click',()=>{
  const isSearchView=document.getElementById('filter-bar').style.display!=='none';
  if(!isSearchView){
    // Not on search view — navigate back to search, showing the filter bar
    navigateTo('search',{});
  }else{
    // Already on search view — reset to defaults and run a fresh * search
    document.getElementById('chkMessages').checked=true;
    document.getElementById('chkProfiles').checked=false;
    document.getElementById('chkObjects').checked=false;
    document.getElementById('chkBitcoin').checked=false;
    document.getElementById('chkTestnet3').checked=true;
    document.getElementById('chkLTC').checked=false;
    document.getElementById('chkDOG').checked=false;
    document.getElementById('chkMZC').checked=false;
    document.getElementById('chkSystem').checked=false;
    document.getElementById('navbar-search-input').value='';
    navigateTo('search',{});
  }
});

// ── Checkbox events — type and chain checkboxes are passive; search only
// runs when the user presses Enter or clicks the Search button.
// (no change listeners needed — performSearch reads all checkbox state on submit)

// ── Profile load more ──────────────────────────────────────────────────
document.getElementById('profileMsgLoadMore').addEventListener('click',()=>loadProfileMessages());

// ── Initial load ───────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  const sp=new URLSearchParams(window.location.search);

  // Apply URL checkbox overrides for search view
  const objects=sp.get('objects');
  const profiles=sp.get('profiles');
  const messages=sp.get('messages');
  const bitcoin=sp.get('bitcoin');
  const testnet3=sp.get('testnet3');
  const ltc=sp.get('ltc');
  const dog=sp.get('dog');
  const mzc=sp.get('mzc');
  if(objects!==null) document.getElementById('chkObjects').checked=objects==='true';
  if(profiles!==null) document.getElementById('chkProfiles').checked=profiles==='true';
  if(messages!==null) document.getElementById('chkMessages').checked=messages==='true';
  if(bitcoin!==null) document.getElementById('chkBitcoin').checked=bitcoin==='true';
  if(testnet3!==null) document.getElementById('chkTestnet3').checked=testnet3==='true';
  if(ltc!==null) document.getElementById('chkLTC').checked=ltc==='true';
  if(dog!==null) document.getElementById('chkDOG').checked=dog==='true';
  if(mzc!==null) document.getElementById('chkMZC').checked=mzc==='true';

  loadFromParams(sp);
});
</script>
</body>
